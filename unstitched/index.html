<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#253b35"><meta name="apple-mobile-web-app-capable" content="yes"><title>The Unstitched Kingdom</title><link rel="icon" href="assets/heroes/h_pinco.webp"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icon-192.png"><link rel="stylesheet" href="style.css"></head><body>
<canvas id="world" aria-label="The Unstitched Kingdom game world"></canvas>
<div id="hud" hidden><div class="hud-top"><button id="pause" class="round" aria-label="Pause">Ⅱ</button><div class="vitals"><div id="chapter-label"></div><div class="health"><i id="health-fill"></i><span id="health-text"></span></div></div><button id="satchel" class="round" aria-label="Camp and party">♧</button></div><div id="party"></div><div id="objective"><span id="objective-text"></span><span id="objective-distance"></span></div><div id="boss-ui" hidden><span id="boss-name"></span><div><i id="boss-fill"></i></div></div><div id="thread"><i></i><span></span></div><div id="hint"></div></div>
<div id="controls" hidden><div id="stick" aria-label="Movement joystick"><div id="stick-knob"></div><span id="move-label"></span></div><div id="actions"><button data-act="dodge" id="dodge"><b>➶</b><span></span><small>K</small></button><button data-act="skill" id="skill"><b>✦</b><span></span><small>L</small></button><button data-act="team" id="team"><b>∞</b><span></span><small>SPACE</small></button><button data-act="attack" id="attack"><b>⚔</b><span></span><small>J</small></button></div><button id="interact" hidden></button></div>
<div id="screen"></div><div id="toast" role="status"></div><div id="update" hidden><span></span><button></button></div>
<audio id="music" loop preload="none"></audio><script src="story.js"></script><script src="game.js"></script></body></html>
