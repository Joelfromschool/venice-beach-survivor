// ===== Flow =====
const FLOW=[['story:s0','fight:0'],['story:s1','train:sb','fight:1'],['story:s2','train:dd','fight:2'],['story:s3','train:ml','fight:3'],['story:s4','steps','story:s5','fight:4'],['end']];
function curStep(){const n=Math.min(5,SAVE.won);const l=FLOW[n];return l[Math.min(SAVE.prog||0,l.length-1)];}
function advance(){const l=FLOW[Math.min(5,SAVE.won)];SAVE.prog=Math.min((SAVE.prog||0)+1,l.length-1);persist();}
function runStep(){const s=curStep();const [k,a]=s.split(':');
 if(k==='story')go(storyScene(a,()=>{advance();runStep()}));
 else if(k==='train')go(trainIntro(a,()=>{advance();runStep()}));
 else if(k==='steps')go(stepsScene(()=>{advance();runStep()}));
 else if(k==='fight')go(vsScene(+a,false));
 else if(k==='end')go(storyScene('end',()=>{SAVE.beat=1;persist();go(creditsScene())}));}
function stepLabel(){const s=curStep(),[k,a]=s.split(':');if(k==='fight')return T('fight')+': '+T('n_'+OPP[+a].id);if(k==='train')return T('train')+': '+T(a+'_name');if(k==='steps')return T('steps');if(k==='end')return T('champ');return T('story');}
const money=v=>'$'+v.toLocaleString('en-US');

 draw(){const img=IMG.bg_steps;const s=Math.max(W/img.width,H/img.height*1.25),iw=img.width*s,ih=img.height*s;const p=easeIO(clamp(t/5.5,0,1));const oy=lerp(H-ih,0,1-p);X.drawImage(img,(W-iw)/2,oy,iw,ih);

   if(k>3.4)bubble(T('st2'),bx-W*.04,by-bh*.95,'#ffe1f2',bx-W*.04,Math.min(1,(k-3.4)*4),W*.6);

 update(dt){t+=dt},
 draw(){cover(IMG['bg_'+TRN[kind].bg],0,0,1.1);shade(.55);vignette(.7);const P=PORTRAIT();
  txt(T('montage'),W/2,ST+H*.1,Math.min(40,W*.1),'#fff',{grad:['#fff6b0','#ffc400','#ff6a00'],st:'#000',lw:9,rot:-.05,sc:1+Math.max(0,.3-t)*2});
  txt(T(kind+'_name'),W/2,ST+H*.1+52,30,'#fff',{st:'#000',lw:7});
  const st=TRN[kind].stat;txt('+ '+T(st),W/2,ST+H*.1+88,20,'#7dffa0',{body:1,w:'800',st:'#000',lw:5});
  const ph=Math.min(H*.36,W*.8);spr(IMG.pinco_coach,W*.3,H*(P?.8:.98),ph,{flip:1});
  bubble(T(kind+'_how'),W*.6,H*(P?.8:.98)-ph*.9,'#ffe1f2',W*.42,Math.min(1,t*3),W*.6);}}}
function trainGame(kind,done){let t=0,score=0,over=false,fb=[],jab={s:'L',t:9};const cfg=TRN[kind];
 const finish=()=>{if(over)return;over=true;MUS.stop();AU.play('bell');const pct=score/cfg.max;const st=cfg.stat;let up=false,maxed=SAVE.stats[st]>=3;
  if(pct>=(kind==='ml'?.7:.55)&&!maxed){SAVE.stats[st]++;up=true}SAVE.train[kind]=1;persist();

  <div style="font-family:var(--disp);font-size:30px;margin:10px 0 18px;color:${up?'#7dffa0':'#ffd34a'}">${up?T('statup',T(st)):maxed?T('maxed'):T('good')}</div><button class="btn" data-a="c">${T('contb')}</button></div><div style="flex:1.2"></div>`);s._act={c:()=>done()};PO.trainDone=kind},700)};
 PO.trainScore=()=>score;
 const beats=[];if(kind==='sb'){let bt=1.6,iv=.66;for(let i=0;i<24;i++){beats.push({t:bt,res:null});bt+=iv;iv=Math.max(.42,iv-.012)}}
 let bagA=0,bagV=0;
 const throws=[];if(kind==='dd'){let tt=1.4;for(let i=0;i<16;i++){const r=Math.random();const type=i===2||i===9||i===14?'coin':(i>4&&r<.3)?'pie':'tomato';throws.push({t:tt,fl:Math.max(.72,1.0-i*.018),type,res:null,lane:pick([-1,0,1])});tt+=Math.max(.95,1.35-i*.03)}}
 let pl={s:'idle',t:0,d:'L'},splat=0;
 let lastSide=null,meatA=0,meatV=0,mlT=10;
 function hitFb(s,c){fb.push({s,c,t:.6})}
 return{
 enter(){MUS.play('fanfare');const s=screen('');s.style.pointerEvents='none';},
 tap(x,y){if(over)return;const side=x<W/2?'L':'R';jab={s:side,t:0};
  if(kind==='sb'){let best=null,bd=9;beats.forEach(b=>{if(b.res)return;const d=Math.abs(b.t-t);if(d<bd){bd=d;best=b}});AU.play('bag');bagV+=(side==='L'?-1:1)*6;
   if(best&&bd<.2){if(bd<.075){best.res='p';score+=2;hitFb(T('perfect'),'#ffd34a');spark(W/2,H*.38,'#ffd34a',10,50)}else{best.res='g';score+=1;hitFb(T('good'),'#7dffa0')}}else{hitFb(T('miss'),'#ff8a8a')}}
  else if(kind==='ml'){if(t<1||mlT<=0)return;AU.play('meat');meatV+=(side==='L'?-1:1)*2.5;SHAKE=3;if(side!==lastSide){score=Math.min(cfg.max,score+1);burst(W/2+(side==='L'?-30:30),H*.42,5,'#fff',220,.3,4);spark(W/2+(side==='L'?-30:30),H*.42,'#fff',6,30)}lastSide=side;vib(8)}},
 swipe(d){if(over||kind!=='dd')return;if(pl.s!=='idle'&&pl.t<.3)return;pl={s:d==='D'?'duck':(d==='L'||d==='R')?'dodge':'idle',t:0,d};AU.play('whoosh')},
 update(dt){t+=dt;fb.forEach(f=>f.t-=dt);fb=fb.filter(f=>f.t>0);jab.t+=dt;pl.t+=dt;if(pl.s!=='idle'&&pl.t>.5)pl={s:'idle',t:0,d:pl.d};splat=Math.max(0,splat-dt*.5);
  if(PO.auto)this.bot(dt);
  if(kind==='sb'){bagV+=-bagA*60*dt;bagV*=Math.pow(.05,dt);bagA+=bagV*dt;beats.forEach(b=>{if(!b.res&&t>b.t+.2){b.res='m';hitFb(T('miss'),'#ff8a8a')}});if(t>beats[beats.length-1].t+.8)finish()}
  if(kind==='dd'){throws.forEach(o=>{if(!o.res&&t>=o.t+o.fl){const ok=o.type==='coin'?pl.s==='idle':o.type==='pie'?pl.s==='duck':pl.s==='dodge';o.res=ok?'ok':'bad';
    if(o.type==='coin'){if(ok){score++;AU.play('coin');hitFb('+$5','#7dffa0');SAVE.money+=5}else{AU.play('bad');hitFb(T('money'),'#ffd34a')}}
    else if(ok){score++;AU.play('ok');hitFb(T('good'),'#7dffa0')}else{AU.play('splat');splat=1;SHAKE=10;hitFb(T('miss'),'#ff8a8a');vib(40)}}});if(t>throws[throws.length-1].t+throws[throws.length-1].fl+.8)finish()}
  if(kind==='ml'){if(t>1)mlT-=dt;meatV+=-meatA*30*dt;meatV*=Math.pow(.1,dt);meatA+=meatV*dt;if(mlT<=0){mlT=0;finish()}}},
 bot(dt){this._b=(this._b||0)-dt;if(kind==='sb'){const b=beats.find(b=>!b.res);if(b&&Math.abs(b.t-t)<.03)this.tap(Math.random()<.5?10:W-10,H/2)}
  if(kind==='ml'&&this._b<=0){this._b=.17;this.tap(lastSide==='L'?W-10:10,H/2)}
  if(kind==='dd'){const o=throws.find(o=>!o.res);if(o&&t>o.t+o.fl-.22&&pl.s==='idle'&&o.type!=='coin')this.swipe(o.type==='pie'?'D':pick(['L','R']))}},
 draw(){if(kind==='ml'){X.save();X.translate(W/2,0);X.rotate(meatA*.012);X.translate(-W/2,0);cover(IMG.bg_freezer,meatA*6,0,1.12);X.restore();shade(.2)}else{cover(IMG['bg_'+cfg.bg],0,0,1.1);shade(.3)}
  const ph=Math.min(H*.3,W*.68),pb=H-ph*.2;
  if(kind==='sb'){const cx=W/2,cy=H*.38,R=Math.min(W,H)*.13;
   X.fillStyle='#5a3a20';rr(cx-R*1.8,cy-R*1.9,R*3.6,R*.35,8);X.fill();X.strokeStyle='#000';X.lineWidth=4;X.stroke();
   X.save();X.translate(cx,cy-R*1.55);X.rotate(bagA*.08);X.fillStyle='#888';X.fillRect(-4,0,8,R*.4);const g=X.createRadialGradient(-R*.3,R*1.0,4,0,R*1.2,R*1.1);g.addColorStop(0,'#ff8080');g.addColorStop(1,'#a0101a');X.fillStyle=g;X.beginPath();X.ellipse(0,R*1.25,R*.62,R*.85,0,0,7);X.fill();X.lineWidth=4;X.strokeStyle='#000';X.stroke();X.restore();
   X.lineWidth=5;X.strokeStyle='rgba(255,255,255,.85)';X.beginPath();X.arc(cx,cy,R*1.25,0,7);X.stroke();
   beats.forEach(b=>{if(b.res)return;const dtb=b.t-t;if(dtb>1.1||dtb<-.2)return;const r=R*1.25*(1+Math.max(0,dtb)*2.2);X.globalAlpha=clamp(1-dtb,0,1);X.strokeStyle=dtb<.08?'#ffd34a':'#7ad7ff';X.lineWidth=6;X.beginPath();X.arc(cx,cy,r,0,7);X.stroke();X.globalAlpha=1});
   const left=beats.filter(b=>!b.res).length;txt(String(left),W-40,ST+40,28,'#fff',{})}
  if(kind==='dd'){const bx=W/2,by=H*.42;spr(IMG.bean_cheer,bx,by,Math.min(H*.3,W*.6),{});
   throws.forEach(o=>{if(o.res||t<o.t)return;const q=clamp((t-o.t)/o.fl,0,1);const x=bx+o.lane*W*.05*q,y=lerp(by-H*.14,pb-ph*(o.type==='pie'?.95:.6),q)-Math.sin(q*Math.PI)*H*.08,s=lerp(10,70,q*q)*Math.min(1,W/390);
    X.save();X.translate(x,y);X.rotate(t*6);if(o.type==='tomato'){X.fillStyle='#e8302a';X.beginPath();X.arc(0,0,s,0,7);X.fill();X.lineWidth=3;X.strokeStyle='#000';X.stroke();X.fillStyle='#3a9a2a';X.beginPath();X.arc(0,-s*.8,s*.3,0,7);X.fill()}
    else if(o.type==='pie'){X.rotate(-t*6);X.fillStyle='#f4e0b0';X.beginPath();X.ellipse(0,0,s*1.2,s*.6,0,0,7);X.fill();X.lineWidth=3;X.strokeStyle='#000';X.stroke();X.fillStyle='#fff';X.beginPath();X.ellipse(0,-s*.2,s,s*.35,0,0,7);X.fill()}
    else{X.rotate(-t*6);X.fillStyle='#ffcc22';X.beginPath();X.arc(0,0,s,0,7);X.fill();X.lineWidth=3;X.strokeStyle='#8a5a00';X.stroke();txt('$',0,2,s*1.1,'#8a5a00',{st:0,sh:0})}X.restore();
    if(q>.45){const lab=o.type==='coin'?T('money'):o.type==='pie'?'\u25bc':T('tomato');txt(lab,x,y-s-20,22,o.type==='coin'?'#ffd34a':'#fff',{st:'#000',lw:5})}});
   txt(score+' / '+cfg.max,W-60,ST+40,24,'#fff',{})}
  if(kind==='ml'){
   const bw=Math.min(W*.8,360);rr((W-bw)/2,ST+70,bw,22,11);X.fillStyle='#0008';X.fill();if(score>0){rr((W-bw)/2,ST+70,Math.max(22,bw*score/cfg.max),22,11);X.fillStyle='#ff5a4a';X.fill()}rr((W-bw)/2,ST+70,bw,22,11);X.lineWidth=2;X.strokeStyle='#fff';X.stroke();txt(T('pow'),W/2,ST+81,16,'#fff',{st:'#000',lw:4,sh:0});
   txt(mlT.toFixed(1),W/2,ST+40,30,mlT<3?'#ff8a8a':'#fff',{})}
  let x=W/2,y=pb,o={a:.9},img=IMG.pooh_back_idle;
  if(kind==='dd'){if(pl.s==='dodge'){x+=(pl.d==='L'?-1:1)*W*.25;o.rot=(pl.d==='L'?-.15:.15)}else if(pl.s==='duck'){y+=ph*.25}}
  else if(jab.t<.15){img=IMG.pooh_back_jab;o.flip=jab.s==='R';y-=ph*.06}
  const sh=ph*.17;spr(IMG.shoeL,x-ph*.2,pb+ph*.2+Math.sin(t*5)*3,sh,{});spr(IMG.shoeR,x+ph*.2,pb+ph*.2+Math.sin(t*5+2)*3,sh*.95,{});spr(img,x,y,ph,o);
  if(splat>0){X.save();X.globalAlpha=splat;X.fillStyle='#d8201c';for(let k=0;k<9;k++){const a=k*.7,r=Math.min(W,H)*(.1+.05*(k%3));X.beginPath();X.arc(W/2+Math.cos(a)*W*.2,H*.5+Math.sin(a)*H*.12,r,0,7);X.fill()}X.restore()}
  fb.forEach(f=>txt(f.s,W/2,H*.62-(.6-f.t)*60,30,f.c,{}));

  spr(IMG.pinco_coach,W*.12,H*.98,Math.min(H*.2,W*.36),{flip:1});}}}

bindInput();
// tag scenes with their kind (used by tests and nothing else)
{const tag=(f,k)=>function(...a){const o=f.apply(this,a);o._k=k;return o};fightScene=tag(fightScene,'fight');trainGame=tag(trainGame,'train');storyScene=tag(storyScene,'story');introScene=tag(introScene,'intro');stepsScene=tag(stepsScene,'steps');creditsScene=tag(creditsScene,'credits');hubScene=tag(hubScene,'hub');vsScene=tag(vsScene,'vs');trainIntro=tag(trainIntro,'tintro');menuScene=tag(menuScene,'menu');}
