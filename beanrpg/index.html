function popText(p,txt,cls,dy){const s=toScreen(p);const d=document.createElement('div');d.className='pop '+(cls||'');d.innerHTML=txt;d.style.left=s.x+'px';d.style.top=(s.y+(dy||0))+'px';$('pops').appendChild(d);setTimeout(()=>d.remove(),cls&&cls.includes('long')?2200:1300);return d;}

 if(o.boss&&BOSS[o.boss].line){await bSay(BOSS[o.boss].img,BOSS[o.boss].n,BOSS[o.boss].line);}
 let res;try{res=await battleLoop();}catch(e){console.error(e);res='win';}
 BT.ui=null;hideCmd();hideList();
 if(res==='win')await victory();
 else if(res==='lose'){await gameOver();BT.on=false;$('bui').classList.remove('on');return 'lose';}
 // write back party
 for(const a of BT.actors.filter(a=>a.side==='p')){G.ch[a.id].hp=Math.max(a.alive?1:0,Math.min(a.hp,maxHP(a.id)));if(!a.alive)G.ch[a.id].hp=1;G.ch[a.id].st={};}
 await fade(1,.25);$('bui').classList.remove('on');$('pops').innerHTML='';BT.on=false;FX.clear();BT.scene=null;GM.mode=prevMode==='battle'?'field':prevMode;FX.scene=F.scene;
 if(GM.mode==='field'){showHUD(true);updHUD();Music.play(F.RD.music||WORLDS[F.RD.world]&&WORLDS[F.RD.world].music||'field');}
 await fade(0,.25);return res;}
function bEnd(){if(!bAlive('e').length)return 'win';if(!bAlive('p').length)return 'lose';return null;}
async function battleLoop(){while(true){BT.turnN++;const order=BT.actors.filter(a=>a.alive).sort((a,b)=>(b.spd*(b.st.fear?.8:1)+rnd(0,3))-(a.spd*(a.st.fear?.8:1)+rnd(0,3)));
  for(const a of order){if(!a.alive)continue;const e=bEnd();if(e)return e;await takeTurn(a);if(BT.ran)return 'run';const e2=bEnd();if(e2)return e2;await wait(.12);}}}
function tickStatus(a){for(const k of['poison','sleep','mute','fear']){if(a.st[k]>0){a.st[k]--;if(a.st[k]===0){delete a.st[k];}}}for(const k of['atk','def']){if(a.buf[k]>0){a.buf[k]--;}}}
async function takeTurn(a){a.defending=false;BT.cur=a;renderParty();
 if(a.st.poison){const d=Math.max(1,Math.round(a.max*.08));await dmgFx(a,d,'poison');if(!a.alive)return;}
 if(a.st.sleep){popText(headPos(a),'💤 Zzz...','st');await wait(.6);tickStatus(a);renderParty();return;}
 if(a.side==='e'&&a.skip){a.skip=0;popText(headPos(a),'Stunned!','st');await wait(.4);return;}
 if(a.side==='p'){const cap=hasEq(a.id,'fpTurn');if(cap&&G.fp<G.fpMax){G.fp++;renderParty();}
  bobActive(a,true);const act=await chooseAction(a);bobActive(a,false);if(act)await doAction(a,act);}
 else await enemyTurn(a);
 tickStatus(a);renderParty();}
function bobActive(a,on){a.active=on;}
function headPos(a){return new THREE.Vector3(a.mesh.position.x,a.mesh.position.y+a.h+.25,a.mesh.position.z);}
function midPos(a){return new THREE.Vector3(a.mesh.position.x,a.mesh.position.y+a.h*.55,a.mesh.position.z);}
// ---------- command input ----------
function chooseAction(a){return new Promise(res=>{BT.ui={a,mode:'cmd',res};showCmd(a);});}
function bInput(){const U=BT.ui;if(!U)return;
 if(U.mode==='cmd'){if(In.consume('A'))cmdPick('atk');else if(In.consume('X'))cmdPick('sp');else if(In.consume('Y'))cmdPick('item');else if(In.consume('B'))cmdPick('def');}
 else if(U.mode==='list'){const n=In.nav();const L=U.list;if(n==='U'||n==='D'){let i=U.sel;for(let k=0;k<L.length;k++){i=(i+(n==='D'?1:L.length-1))%L.length;if(!L[i].dis)break;}U.sel=i;SFX.sel();renderList();}
  if(In.consume('A')){const it=L[U.sel];if(it&&!it.dis){SFX.ok();it.fn();}else SFX.err();}if(In.consume('B')){SFX.back();hideList();U.mode='cmd';showCmd(U.a);}}
 else if(U.mode==='target'){const n=In.nav();const T=U.tg;if(!U.all&&(n==='L'||n==='R'||n==='U'||n==='D')){U.ti=(U.ti+(n==='R'||n==='D'?1:T.length-1))%T.length;SFX.sel();}
  if(In.consume('A')){SFX.ok();hideCursor();const r=U.res,act=Object.assign({},U.act,{tg:U.all?T:[T[U.ti]]});BT.ui=null;r(act);}
  if(In.consume('B')){SFX.back();hideCursor();if(U.back)U.back();else{U.mode='cmd';showCmd(U.a);}}}}
function cmdPick(k){const U=BT.ui;if(!U||U.mode!=='cmd')return;const a=U.a;SFX.ok();hideCmd();
 if(k==='atk'){toTarget({k:'atk'},'enemy');}
 else if(k==='sp'){if(a.st.mute){SFX.err();banner('Muted! Can\'t use specials.');showCmd(a);return;}
  const L=knownSpecials(a.id).map(s=>({ic:'✨',n:SP[s].n,r:SP[s].fp+' FP',d:SP[s].d,dis:G.fp<SP[s].fp&&!G.infFP,fn(){hideList();toTarget({k:'sp',sp:s},SP[s].tgt,()=>{openList(L,'Specials');});}}));openList(L,'Specials');}
 else if(k==='item'){const L=Object.keys(G.inv).filter(i=>G.inv[i]>0).map(i=>({ic:IT[i].ic,n:IT[i].n,r:'x'+G.inv[i],d:IT[i].d,fn(){hideList();const t=IT[i];const tg=t.dmg?'enemy':t.dmgAll?'all':t.healAll||t.atkUp||t.defUp?'party':t.fp&&!t.heal?'none':'ally';toTarget({k:'item',item:i},tg,()=>openList(L,'Items'));}}));
  if(!L.length){SFX.err();banner('No items!');showCmd(a);return;}openList(L,'Items');}
 else if(k==='def'){const L=[{ic:'🛡️',n:'Defend',d:'Halve damage until your next turn.',fn(){hideList();const r=U.res;BT.ui=null;r({k:'def'});}},{ic:'🏃',n:'Run Away',d:BT.boss?'Can\'t run from a boss!':'Try to escape.',dis:!!BT.boss,fn(){hideList();const r=U.res;BT.ui=null;r({k:'run'});}}];openList(L,'Defend / Run');}}
function knownSpecials(id){return CH[id].spec.filter((s,i)=>G.ch[id].lv>=CH[id].learn[i]);}
function openList(L,title){const U=BT.ui;U.mode='list';U.list=L;U.sel=Math.max(0,L.findIndex(x=>!x.dis));U.title=title;renderList();$('blist').classList.add('on');}
function hideList(){$('blist').classList.remove('on');}
function renderList(){const U=BT.ui;const el=$('blist');el.innerHTML='<div class="lt">'+esc(U.title)+'<span class="fpv">FP '+(G.infFP?'∞':G.fp)+'/'+G.fpMax+'</span></div>'+U.list.map((it,i)=>'<button class="li'+(i===U.sel?' sel':'')+(it.dis?' dis':'')+'" data-i="'+i+'">'+icon(it.ic)+'<span class="ln">'+esc(it.n)+'</span><span class="lr">'+(it.r||'')+'</span></button>').join('')+'<div class="ld">'+esc((U.list[U.sel]||{}).d||'')+'</div><button class="lback">B · Back</button>';
 el.querySelectorAll('.li').forEach(b=>b.onclick=e=>{e.stopPropagation();const i=+b.dataset.i;if(U.sel===i||TOUCH){U.sel=i;const it=U.list[i];if(!it.dis){SFX.ok();it.fn();}else SFX.err();}else{U.sel=i;SFX.sel();renderList();}});
 el.querySelector('.lback').onclick=e=>{e.stopPropagation();In.press('B');};const s=el.querySelector('.sel');if(s&&s.scrollIntoView)s.scrollIntoView({block:'nearest'});}
function icon(ic){if(!ic)return'<i class="ic"></i>';if(ART[ic])return'<img class="ic" src="'+ART[ic].src+'">';return'<i class="ic">'+ic+'</i>';}
function toTarget(act,kind,back){const U=BT.ui;const a=U.a;let T;
 if(kind==='enemy'||kind==='all')T=bAlive('e');else if(kind==='party')T=bAlive('p');else if(kind==='ally')T=act.item&&IT[act.item].revive?BT.actors.filter(x=>x.side==='p'&&!x.alive):BT.actors.filter(x=>x.side==='p'&&x.alive);else T=[a];
 if(!T.length){SFX.err();banner(act.item&&IT[act.item].revive?'Nobody needs reviving!':'No target!');if(back)back();else{U.mode='cmd';showCmd(a);}return;}
 if(kind==='none'){const r=U.res;BT.ui=null;r(Object.assign({},act,{tg:[a]}));return;}
 U.mode='target';U.act=act;U.tg=T;U.ti=0;U.all=kind==='all'||kind==='party';U.back=back?()=>{U.mode='list';back();}:null;showCursor();}
function tapTarget(cx,cy){const U=BT.ui;if(!U||U.mode!=='target')return false;let best=-1,bd=1e9;U.tg.forEach((t,i)=>{const s=toScreen(midPos(t));const d=Math.hypot(s.x-cx,s.y-cy);if(d<bd){bd=d;best=i;}});
 if(bd<140){if(U.all||U.ti===best){In.press('A');}else{U.ti=best;SFX.sel();}return true;}return false;}
// ---------- action execution ----------
async function doAction(a,act){
 if(act.k==='atk')await attack(a,act.tg[0]);
 else if(act.k==='def'){a.defending=true;banner(a.name+' defends!');popText(headPos(a),'🛡️ DEFEND','st');SFX.guard();await wait(.6);}
 else if(act.k==='run'){banner('Running away...');SFX.run();const ok=Math.random()<.75;await Promise.all(bAlive('p').map(p=>tween(.4,t=>{p.mesh.position.x=p.home.x+t*(ok?6:1.2);})));
  if(ok){BT.ran=true;banner('Got away!');await wait(.4);}else{banner('Couldn\'t escape!');SFX.err();await Promise.all(bAlive('p').map(p=>tween(.3,t=>{p.mesh.position.x=p.home.x+1.2*(1-t);})));}}
 else if(act.k==='item')await useItem(a,act.item,act.tg);
 else if(act.k==='sp'){const s=SP[act.sp];if(!G.infFP)G.fp-=s.fp;renderParty();await special(a,act.sp,act.tg);}}
function moveTo(a,p,d,arc){const s=a.mesh.position.clone();return tween(d,t=>{a.mesh.position.lerpVectors(s,p,ease.inout(t));if(arc)a.mesh.position.y=s.y+(p.y-s.y)*t+Math.sin(t*Math.PI)*arc;});}
function frontOf(t,a,dist){const dir=new THREE.Vector3().subVectors(a.home,t.home).setY(0).normalize();return t.home.clone().addScaledVector(dir,dist||(t.boss?1.5:1.0));}
// timing window: returns 0 miss, 1 good, 2 perfect
function timingWindow(t0,kind){const w=hasAnyShades()?1.5:1;return new Promise(res=>{BT.tim={t0,start:t0-.45,good:[.17*w,.06*w],perf:[.065*w,.035*w],res,pressed:null,kind};});}
function hasAnyShades(){return BT.cur&&BT.cur.side==='p'?!!hasEq(BT.cur.id,'timing'):false;}
function timCheck(){const T=BT.tim;if(!T)return;const n=now();if(DEBUG&&window.AUTOT&&T.pressed==null&&n>=T.t0-.012){T.pressed=n;BT.autoN=(BT.autoN||0)+1;}
 if(T.pressed==null){for(const b of['A','B','X','Y']){if(In.hit[b]&&In.t[b]>=T.start){T.pressed=In.t[b];In.hit[b]=false;break;}}}
 if(n>=T.t0+T.good[1]||(T.pressed!=null&&n>=T.t0-.02&&T.pressed<T.t0-T.good[0])){let r=0;if(T.pressed!=null){const d=T.pressed-T.t0;if(d>=-T.perf[0]&&d<=T.perf[1])r=2;else if(d>=-T.good[0]&&d<=T.good[1])r=1;}BT.tim=null;hideRing();T.res(r);}}
function ringAt(p,t0,col){if(!SET.hints)return;const el=$('tring');BT.ring={p,t0,col};el.style.display='block';}
function hideRing(){$('tring').style.display='none';BT.ring=null;}
function updRing(){const r=BT.ring;if(!r)return;const el=$('tring');const s=toScreen(r.p);const k=clamp((r.t0-now())/.5,0,1);const sz=40+k*120;el.style.left=s.x+'px';el.style.top=s.y+'px';el.style.width=el.style.height=sz+'px';el.style.opacity=k>0?.95:0;el.style.borderColor=k<.25?'#ffe14a':(r.col||'#fff');}
function timePopup(r,a,guard){const p=headPos(a);if(guard){if(r===2){popText(p,'PERFECT GUARD!','tm perf',-30);SFX.guard(1);}else if(r===1){popText(p,'GUARD!','tm good',-30);SFX.guard(0);}return;}
 if(r===2){popText(p,'EXCELLENT!','tm perf',-30);SFX.nice(2);BT.perfects++;}else if(r===1){popText(p,'NICE!','tm good',-30);SFX.nice(1);}}
function physDmg(att,tgt,mult){const ab=att.buf.atk?1.5:1,fb=att.st.fear?.7:1,db=(tgt.buf.def?1.5:1)*(tgt.st.fear?.7:1)*(tgt.defending?1.6:1);const raw=att.atk*ab*fb*rnd(.92,1.08)-tgt.def*db*.6;return Math.max(1,Math.round(raw*mult));}
function magDmg(att,tgt,pow,q){const db=(tgt.buf.def?1.3:1)*(tgt.defending?1.5:1);return Math.max(1,Math.round(((pow||0)+att.mag*1.0-tgt.mdef*db*.5)*q*rnd(.94,1.06)));}
async function dmgFx(t,d,kind){t.hp=Math.max(0,t.hp-d);const p=headPos(t);popText(p,String(d),'dmg'+(kind==='crit'?' crit':kind==='poison'?' poi':''));
 if(t.st.sleep&&kind!=='poison'&&Math.random()<.6){delete t.st.sleep;popText(p,'Woke up!','st',30);}
 flash(t,kind==='poison'?0x9a4aff:0xff4a4a);knock(t);if(t.side==='e'){hpBar(t);}else{SFX.hurt();}renderParty();
 if(t.hp<=0)await ko(t);}
function healFx(t,n){const was=t.hp;t.hp=Math.min(t.max,t.hp+n);popText(headPos(t),'+'+(t.hp-was),'heal');FX.burst(midPos(t),10,{col:[0x7aff8a,0xffffff],sp:1.2,up:2.5,g:-1,size:.22});renderParty();}
function flash(t,c){const o=t.spr||t.model;if(!o)return;const mats=[];o.traverse(m=>{if(m.material&&m.material.color)mats.push(m.material);});mats.forEach(m=>{if(!m.userData.c0)m.userData.c0=m.color.clone();m.color.setHex(c);});setTimeout(()=>mats.forEach(m=>{m.color.copy(m.userData.c0);if(m.emissive&&m.userData.e0)m.emissive.copy(m.userData.e0);}),110);}
function knock(t){const s=t.home.x,dir=t.side==='e'?-1:1;tween(.25,k=>{t.mesh.position.x=(t.mesh.position.x-s>2?t.mesh.position.x:s)+Math.sin(k*Math.PI)*.25*dir;});shake(.12);}
async function ko(t){t.alive=false;t.st={};if(t.side==='e'){SFX.poof();BT.xp+=t.E.xp;BT.coins+=t.E.coins;const p=midPos(t);
  await tween(.45,k=>{t.mesh.rotation.y=k*8;t.mesh.scale.setScalar(1-k*.9);t.mesh.position.y=k*.8;});t.mesh.visible=false;t.sh.visible=false;FX.burst(p,18,{star:1,col:[0xffe060,0xffffff,0xff8ad8],sp:3,up:4,size:.3});
  if(!t.boss&&Math.random()<.18){const d=pick(dropTable(t.E.t));BT.drops.push(d);popText(p,'+'+IT[d].n,'st',20);}}
 else{SFX.ko();popText(headPos(t),'KO!','dmg crit');await tween(.3,k=>{t.spr.rotation.z=-k*Math.PI/2*.9;t.mesh.position.y=-k*.05;});t.spr.material.color.setHex(0x8a8a9a);t.spr.material.userData.c0=new THREE.Color(0x8a8a9a);}
 renderParty();}
function revive(t,frac){t.alive=true;t.hp=Math.max(1,Math.round(t.max*frac));t.spr.rotation.z=0;t.spr.material.color.setHex(0xffffff);t.spr.material.userData.c0=new THREE.Color(0xffffff);t.mesh.position.y=0;popText(headPos(t),'Revived!','heal');renderParty();}
function dropTable(t){return t<1?['edamame','candycorn','tea']:t<3?['yakitori','candycorn','tea','cupcake']:t<5?['ramen','lolly','maki','cupcake']:['ramen','lolly','steak','crepe','dessert'];}
function retarget(t){if(t&&t.alive)return t;const L=bAlive('e');return L[0];}
async function attack(a,t){t=retarget(t);if(!t)return;banner(CH[a.id].atkName);const front=frontOf(t,a);
 await moveTo(a,front,.34,a.id==='bean'?1.2:a.id==='pooh'?.5:0);
 // windup
 const base=a.mesh.position.clone();await tween(.14,k=>{a.mesh.position.y=base.y+Math.sin(k*Math.PI*.5)*.35;a.spr.rotation.z=-k*.25*(a.side==='p'?-1:1);});
 const t0=now()+.13;ringAt(midPos(t),t0);const tw=tween(.13,k=>{a.mesh.position.lerpVectors(base,t.mesh.position.clone().setY(base.y+.2),k*.55);a.spr.rotation.z=.25-k*.5;});
 const r=await timingWindow(t0);await tw;a.spr.rotation.z=0;
 let mult=1;if(r===2){mult=1.6+Math.min(.5,BT.chain*.05);BT.chain++;}else if(r===1){mult=1.4;BT.chain=Math.max(0,BT.chain);}else BT.chain=0;
 timePopup(r,a);SFX.hit(r>0);FX.burst(midPos(t),r?14:6,{star:r>0,col:r===2?[0xffe060,0xff8ad8,0x8ae8ff]:0xffffff,sp:3,up:3,size:r?.3:.2});
 const crit=Math.random()<.04;if(crit){mult*=1.5;SFX.crit();}const d=physDmg(a,t,mult);await dmgFx(t,d,crit||r===2?'crit':null);
 if(r===2){for(const o of bAlive('e')){if(o===t)continue;await wait(.06);await dmgFx(o,Math.max(1,Math.round(d*.35)));}}
 await wait(.12);await moveTo(a,a.home,.32,a.id==='bean'?.8:0);}
// ---------- enemy turns ----------
async function enemyTurn(a){const E=a.E;let opts=E.atks.filter(k=>!EA[k].p2||a.p2);if(a.p2)opts=opts.concat(E.atks.filter(k=>EA[k].p2));
 if(a.hp>a.max*.6)opts=opts.filter(k=>EA[k].k!=='heal')||opts;if(!opts.length)opts=['bump'];let k=pick(opts);if(EA[k].k==='heal'&&a.hp>a.max*.6)k=E.atks[0];const A=EA[k];
 const P=bAlive('p');if(!P.length)return;let tg=A.all?P:[pick(P)];
 banner(A.n,'foe');await wait(.25);
 if(A.k==='heal'){SFX.heal();healFx(a,Math.round(a.max*A.pow));await wait(.6);return;}
 if(A.k==='buff'){SFX.magic();for(const o of bAlive('e')){o.buf.atk=3;popText(headPos(o),'ATK UP!','st');FX.burst(midPos(o),10,{col:0xff6a6a,sp:1,up:2,g:-1});}await wait(.7);return;}
 if(A.self){/* kamikaze */}
 const hits=A.hits||1;
 for(let h=0;h<hits;h++){if(!bAlive('p').length)break;tg=tg.filter(x=>x.alive);if(!tg.length)tg=A.all?bAlive('p'):[pick(bAlive('p'))];
  let t0;
  if(A.k==='phys'&&!A.all){const t=tg[0];const front=frontOf(t,a,a.boss?1.6:1.1);
   if(A.dig){await tween(.4,k=>{a.mesh.position.y=-k*a.h;});a.mesh.position.set(front.x,-a.h,front.z);await wait(.3);}
   else if(h===0)await moveTo(a,front,.36,E.fly?.3:.6);
   const base=a.mesh.position.clone();await tween(.16,k=>{a.mesh.position.x=base.x-k*.3;a.mesh.scale.set(1,1+k*.1,1);});
   t0=now()+(A.dig?.2:.14);ringAt(midPos(t),t0,'#ff8a8a');
   const tw=A.dig?tween(.2,k=>{a.mesh.position.y=-a.h*(1-ease.out(k));}):tween(.14,k=>{a.mesh.position.x=base.x-.3+k*.7;a.mesh.scale.set(1,1.1-k*.1,1);});
   const r=await timingWindow(t0,'guard');await tw;a.mesh.scale.set(1,1,1);
   await hitParty(a,t,A,r);if(A.dig||h===hits-1){await wait(.1);await moveTo(a,a.home,.34,.4);a.mesh.position.copy(a.home);}}
  else{// projectile/aoe
   await tween(.2,k=>{a.mesh.position.y=Math.sin(k*Math.PI)*.4;});SFX.magic();
   const fly=.5;t0=now()+fly;for(const t of tg)projectile(a,t,A.fx||'bolt',fly);ringAt(midPos(tg[0]),t0,'#ff8a8a');const r=await timingWindow(t0,'guard');
   if(A.all)shake(.15);for(const t of tg){await hitParty(a,t,A,r);}}
  await wait(.15);}
 if(A.self&&a.alive){await dmgFx(a,a.hp,'crit');}}
async function hitParty(a,t,A,r){timePopup(r,t,true);let mult=A.pow||1;if(r===2)mult=0;else if(r===1)mult*=.5;
 if(A.k==='status'){if(r===2||hasEq(t.id,'noStatus')){popText(headPos(t),'Resisted!','st');return;}if(Math.random()<(A.st[1]+.2)*(r?0.5:1)){applySt(t,A.st[0]);}else popText(headPos(t),'Miss!','st');return;}
 if(mult===0){FX.burst(midPos(t),10,{star:1,col:0x8ae8ff,sp:2,up:2});popText(headPos(t),'0','dmg');return;}
 const d=A.k==='phys'?physDmg(a,t,mult):Math.max(1,Math.round((a.mag*mult*1.05-t.mdef*.5*(t.defending?1.5:1))*rnd(.92,1.08)));
 FX.burst(midPos(t),8,{col:0xffffff,sp:2,up:2});SFX.hit(A.big);if(A.big)shake(.3);await dmgFx(t,d);
 if(A.drain&&a.alive)healFx(a,Math.round(d*.6));

 if(kind==='rhythm'){const N=5,iv=.55,t1=st+1.1;M.beats=[];for(let i=0;i<N;i++)M.beats.push({t:t1+i*iv,hit:0});rr.innerHTML='<div class="rtrack"><div class="rring"></div>'+M.beats.map((b,i)=>'<div class="rstar" id="rs'+i+'">★</div>').join('')+'</div>';}

   if(In.consume('A')||In.consume('B')){const tn=In.t.A||n;let best=null,bd=1;for(const b of M.beats){if(b.hit)continue;const d=Math.abs(n-b.t);if(d<bd){bd=d;best=b;}}

function tickNav(){const root=UI.nav;if(!root||UI.dlg)return;const bs=[...root.querySelectorAll('button:not(:disabled),input')].filter(b=>b.offsetParent!==null);if(!bs.length)return;let cur=root.querySelector('.kf');if(cur&&!bs.includes(cur)){cur.classList.remove('kf');cur=null;}
 const n=In.nav();if(n){if(!cur){bs[0].classList.add('kf');return;}const r0=cur.getBoundingClientRect(),c0={x:r0.left+r0.width/2,y:r0.top+r0.height/2};let best=null,bd=1e9;
  for(const b of bs){if(b===cur)continue;const r=b.getBoundingClientRect(),c={x:r.left+r.width/2,y:r.top+r.height/2};const dx=c.x-c0.x,dy=c.y-c0.y;let ok=n==='U'?dy<-4:n==='D'?dy>4:n==='L'?dx<-4:dx>4;if(!ok)continue;const d=(n==='U'||n==='D')?Math.abs(dy)+Math.abs(dx)*2.2:Math.abs(dx)+Math.abs(dy)*2.2;if(d<bd){bd=d;best=b;}}
  if(best){cur.classList.remove('kf');best.classList.add('kf');best.scrollIntoView&&best.scrollIntoView({block:'nearest'});SFX.sel();}}
 if(In.consume('A')){if(cur){if(cur.tagName==='INPUT')cur.focus();else cur.click();}else{bs[0].classList.add('kf');}}
 if(In.consume('B')||In.consume('MENU')){if(UI.back){SFX.back();UI.back();}}}

 const opts=[['hp','❤️ HP',{hp:rint(3,5)*m}],['pow','💪 Attack & Defense',{atk:rint(1,3)*m,def:rint(1,2)*m}],['mag','✨ Sp.Atk & Sp.Def',{mag:rint(1,3)*m,mdef:rint(1,2)*m}]];

 if(!sell)h+=L.map(e=>{const k=pea?e[0]:e,p=pea?e[1]:(IT[k]?IT[k].p:EQ[k].p),D=IT[k]||EQ[k];const own=IT[k]?(G.inv[k]||0):(G.eqInv[k]||0);const ok=pea?G.pea>=p:(G.infCoins||G.coins>=p);const who=EQ[k]?(EQ[k].who==='all'?'Anyone':CH[EQ[k].who].n):'';

async function poohBank(){const p=G.party.includes('pooh');
 await say([[p?'pooh':'p_j_king',p?'Welcome to the POOH BANK! My bank! Put coins in, they get BIGGER. That\'s how money works. I think.':'Welcome to the royal Pooh Bank! My little Pooh runs it, but he\'s out adventuring... I\'ll keep your coins safe.',p?'Pooh':'King Pooh']]);
 while(true){const i=await ask('Pooh Bank: '+G.bank+' coins saved. You have '+(G.infCoins?'∞':G.coins)+'. Every Bean Star you find adds 10% interest!',['Deposit 50','Deposit ALL','Withdraw 50','Withdraw ALL','Leave'],p?'pooh':'p_j_king');

 G.stars[i]=1;G.unlocked=Math.max(G.unlocked,i+2);const intr=Math.min(300,Math.round(G.bank*.1));G.bank+=intr;G.pea+=3;healParty();updHUD();

function credits(){return new Promise(async res=>{GM.mode='end';showHUD(false);const el=$('sEnd');const cast=[['bean_a0b0l0','Mr Bean'],['pinco','Pinco'],['pooh','Pooh'],['p_c_tad','Mr Pooping'],['p_c_leaf','Sprout'],['p_c_mole','Mogu Mogu'],['p_c_baller','Slam Dunkle'],['p_c_holiday','Jolly Jingles'],['p_c_party','Party Hat Guy'],['p_j_kermit','Dark Kermit'],['p_j_bean','Emo Bean'],['p_j_king','King Pooh'],['p_c_max','Max']];

function loop(){requestAnimationFrame(loop);const t=performance.now()/1000;const dt=Math.min(.05,t-last);last=t;R.t+=dt;F.t+=dt;

function updBattle(dt,paused){const d=Math.max(20,5.2/(.2126*(R.aspect||1.6)));R.cam.position.set(0,.9,0).addScaledVector(CAMOFF,d);if(R.shake>0){R.cam.position.x+=rnd(-1,1)*R.shake;R.cam.position.y+=rnd(-1,1)*R.shake;}R.cam.lookAt(0,.9,0);

 const mv=e=>{const r=base.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=(e.clientX-cx)/56,dy=-(e.clientY-cy)/56;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l;}In.sx=dx;In.sy=dy;In.stickOn=true;knob.style.transform='translate('+dx*36+'px,'+(-dy*36)+'px)';};
 zone.addEventListener('pointerdown',e=>{e.preventDefault();sid=e.pointerId;zone.setPointerCapture&&zone.setPointerCapture(sid);mv(e);});zone.addEventListener('pointermove',e=>{if(e.pointerId===sid)mv(e);});
 const up=e=>{if(e.pointerId!==sid)return;sid=null;In.stickOn=false;In.sx=In.sy=0;knob.style.transform='';};zone.addEventListener('pointerup',up);zone.addEventListener('pointercancel',up);
 for(const k of['A','B','X','Y']){const b=$('fb'+k);b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();b.classList.add('dn');In.press(GM.mode!=='battle'&&k==='X'?'MENU':k);if(k==='A')In.touchA=true;if(k==='B')In.touchB=true;});
  const u=()=>{b.classList.remove('dn');if(k==='A')In.touchA=false;if(k==='B')In.touchB=false;};b.addEventListener('pointerup',u);b.addEventListener('pointercancel',u);b.addEventListener('pointerleave',u);}

 gl.addEventListener('pointermove',e=>{if(GM.mode==='battle'&&BT.mg&&BT.mg.k==='spin'&&In.mouseA){const a=Math.atan2(e.clientY-innerHeight/2,e.clientX-innerWidth/2);if(lastAng!=null){let da=a-lastAng;while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;In.spin+=Math.abs(da);}lastAng=a;}});
 addEventListener('pointerup',()=>{In.mouseA=false;lastAng=null;});addEventListener('pointercancel',()=>{In.mouseA=false;});
 $('mbtn').onclick=e=>{e.stopPropagation();openMenu();};$('bmbtn').onclick=e=>{e.stopPropagation();if(BT.ui&&BT.ui.mode==='cmd')openMenu('party');};
