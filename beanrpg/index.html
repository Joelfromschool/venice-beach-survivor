function nodeOpen(i){const n=MAPN[i];if(n.id==='town')return true;if(n.id==='w8')return G.stars.every(Boolean);return n.w<G.unlocked;}
function mapLabel(){const n=MAPN[MAPM.node];roomTitle(n.n+(n.w!=null&&n.w<7&&G.stars[n.w]?' ⭐':''));}
async function mapMove(to){if(MAPM.moving||to===MAPM.node)return;if(!nodeOpen(to)){SFX.err();toastQ('🔒 Not unlocked yet!');return;}MAPM.moving=true;const step=to>MAPM.node?1:-1;
 while(MAPM.node!==to){let nx=MAPM.node+step;if(MAPN[nx].id==='w8'&&to!==MAPM.node+step&&true){}const a=MAPN[MAPM.node],b=MAPN[nx];const P=F.P;const ya=P.y,yb=F.M.h[b.z*F.M.w+b.x]*HU+.25;P.face=(b.x-a.x)-(b.z-a.z)>0?1:-1;SFX.hop();

function bindTouch(){const zone=$('stickZone'),base=$('stickBase'),knob=$('stickKnob');let sid=null;
 const mv=e=>{const r=base.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=(e.clientX-cx)/56,dy=-(e.clientY-cy)/56;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l;}In.sx=dx;In.sy=dy;In.stickOn=true;knob.style.transform='translate('+dx*36+'px,'+(-dy*36)+'px)';};
