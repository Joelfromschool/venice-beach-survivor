<script>

addEventListener('resize',fit);
// ---------- helpers ----------
const OL='#1a1020';
const R=(x,y,w,h,c)=>{X.fillStyle=c;X.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));};
