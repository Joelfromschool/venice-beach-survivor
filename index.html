<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Games</title></head>
<body style="margin:0;background:#1a1030;font-family:sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:20px">
<h1>Pick a game</h1>
<a href="venice/" style="background:#f90;color:#000;padding:18px 30px;border-radius:12px;text-decoration:none;font-size:22px;font-weight:bold">Venice Beach Survivor</a>
<a href="space/" style="background:#6cf;color:#000;padding:18px 30px;border-radius:12px;text-decoration:none;font-size:22px;font-weight:bold">Mr Bean &amp; Pooh: Space</a>
<a href="gladiator/" style="background:#c8323c;color:#fff;padding:18px 30px;border-radius:12px;text-decoration:none;font-size:22px;font-weight:bold">Atticus Vorn (Gladiator RPG)</a>
<a href="pinco/" style="background:#ff7eb6;color:#fff;padding:18px 30px;border-radius:12px;text-decoration:none;font-size:22px;font-weight:bold">Pinco Pretty Princess 👑</a>
<a href="turf/" style="background:#8e44ec;color:#fff;padding:18px 30px;border-radius:12px;text-decoration:none;font-size:22px;font-weight:bold">Turf Splat (Paintball FPS) 🎨</a>
<a href="mossheart/" style="background:#3f7a3a;color:#fff;padding:18px 30px;border-radius:12px;text-decoration:none;font-size:22px;font-weight:bold">Mossheart (Forest FPS) 🍃</a>
<a href="beanrpg/" style="background:#5cb82e;color:#fff;padding:18px 30px;border-radius:12px;text-decoration:none;font-size:22px;font-weight:bold">Mr Bean RPG (Adventure RPG) ⭐</a>
<a href="secret/" id="secretTile" style="background:#e8590c;color:#fff;padding:18px 30px;border-radius:12px;text-decoration:none;font-size:22px;font-weight:bold">Secret Project 🎃</a>
<div id="spGate" style="display:none;position:fixed;inset:0;background:#000c;z-index:99;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px"><div style="background:#2a1238;border:3px solid #ff9a2e;border-radius:18px;padding:24px;max-width:340px;width:100%"><div style="font-size:48px">🎃</div><div style="font-size:24px;font-weight:bold;margin:6px 0 12px">Secret Project</div><div style="margin-bottom:10px">Enter the password</div><input id="spPw" type="password" autocomplete="off" autocapitalize="off" style="font-size:22px;padding:12px;border-radius:10px;border:0;width:100%;text-align:center;box-sizing:border-box"><div id="spErr" style="color:#f88;height:22px;margin-top:6px"></div><button id="spGo" style="font-size:22px;font-weight:bold;padding:14px 30px;border-radius:12px;border:0;background:#ff8a1e;color:#fff;width:100%;margin-top:6px">Open</button><button id="spX" style="font-size:18px;padding:12px 30px;border-radius:12px;border:0;background:#5a4b70;color:#fff;width:100%;margin-top:10px">Cancel</button></div></div>
<script>(function(){var t=document.getElementById('secretTile'),g=document.getElementById('spGate'),i=document.getElementById('spPw');t.addEventListener('click',function(e){e.preventDefault();try{if(localStorage.getItem('secret_pw_ok')==='pumpkin'){location.href='secret/';return;}}catch(x){}g.style.display='flex';i.value='';document.getElementById('spErr').textContent='';setTimeout(function(){i.focus()},50);});function go(){if(i.value.trim().toLowerCase()==='pumpkin'){try{localStorage.setItem('secret_pw_ok','pumpkin');}catch(x){}location.href='secret/';}else{document.getElementById('spErr').textContent='Wrong password';i.value='';}}document.getElementById('spGo').onclick=go;i.addEventListener('keydown',function(e){if(e.key==='Enter')go();});document.getElementById('spX').onclick=function(){g.style.display='none';};})();</script>
</body></html>
