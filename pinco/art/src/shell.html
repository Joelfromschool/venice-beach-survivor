.gbox #gift-h{font-size:22px;font-weight:900;color:var(--pk)}.gbox #gift-who{height:110px;animation:bob 1.4s ease-in-out infinite}.gbox #gift-it{width:110px;height:110px;animation:reveal 1.2s cubic-bezier(.2,1.6,.4,1);filter:drop-shadow(0 0 16px #ffcc33)}
@keyframes reveal{0%{transform:scale(0) rotate(-180deg);opacity:0}60%{transform:scale(1.3) rotate(10deg);opacity:1}100%{transform:none}}#gift-n{display:block;margin-bottom:12px;color:#8e44ec;font-size:18px}
#tut-b{text-align:left;font-weight:800;font-size:15px;line-height:1.45;margin-bottom:14px}#tut-b p{margin:4px 0}
.sc-goal{font-weight:900;color:#8e44ec;margin:2px 0 6px}
