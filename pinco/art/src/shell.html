<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Pinco">
<meta name="theme-color" content="#ff7eb6"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png">
<title>Pinco Pretty Princess</title><script>window.__BUILD__="%BUILD%"</script>
<style>
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--pk:#ff3d8b;--pk2:#ff7eb6;--pu:#8e44ec;--F:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Nunito",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#ffd6ea;font-family:var(--F);color:#5a2a6a;user-select:none;-webkit-user-select:none;touch-action:manipulation;overscroll-behavior:none}
canvas{position:fixed;inset:0;display:block}
button{font-family:var(--F);cursor:pointer;border:0;color:inherit}
.scr{position:fixed;inset:0;display:none;pointer-events:none;flex-direction:column}.scr.on{display:flex}.scr>*{pointer-events:auto}
.big{min-height:60px;padding:0 28px;border-radius:30px;font-size:22px;font-weight:800;color:#fff;background:linear-gradient(#ff6fae,#ff3d8b);box-shadow:0 5px 0 #c4166a,0 10px 24px #ff3d8b55;letter-spacing:.5px;transition:transform .08s}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #c4166a}
.big.alt{background:linear-gradient(#b48bff,#8e44ec);box-shadow:0 5px 0 #5d1fb0,0 10px 24px #8e44ec44}
.big.ghost{background:#fff;color:var(--pu);box-shadow:0 5px 0 #e2c6f0}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fffd;border-radius:20px;padding:6px 12px;font-weight:800;font-size:16px;box-shadow:0 3px 0 #0001}
.coinic{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6b0,#ffcc33 45%,#d99a00);box-shadow:inset 0 0 0 2px #c48a00;display:inline-block}
.mute{width:44px;height:44px;border-radius:22px;background:#fffd;font-size:20px;box-shadow:0 3px 0 #0001}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:calc(var(--sat) + 10px) 12px 0}
/* title */
#s-title{align-items:center}
.logo{margin-top:calc(var(--sat) + 4vh);text-align:center;line-height:.95;filter:drop-shadow(0 4px 0 #fff)}
.logo b{display:block;font-size:min(15vw,64px);font-weight:900;color:var(--pk);-webkit-text-stroke:2px #fff;text-shadow:0 5px 0 #c4166a,0 0 24px #fff}
.logo i{display:block;font-style:normal;font-size:min(10vw,40px);font-weight:900;color:var(--pu);-webkit-text-stroke:1.5px #fff;text-shadow:0 4px 0 #5d1fb0;margin-top:4px}
.tbtns{margin-top:auto;margin-bottom:calc(var(--sab) + 6vh);display:flex;flex-direction:column;gap:14px;align-items:center;width:100%}
.tbtns .big{width:min(78vw,320px)}#t-best{font-weight:800;color:#8e44ec;background:#fffc;border-radius:12px;padding:3px 10px;min-height:1px}#t-best:empty{display:none}
.ver{position:fixed;right:10px;bottom:calc(var(--sab) + 6px);font-size:11px;font-weight:800;color:#a06aa8;opacity:.8}
/* theme */
#s-theme{align-items:center;justify-content:center;background:#2a0b3d99;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.card0{width:min(86vw,360px);background:linear-gradient(#fff,#ffeaf5);border-radius:28px;padding:26px 20px;text-align:center;box-shadow:0 10px 0 #ff9fca,0 20px 40px #0005;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.4) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
.card0 small{font-weight:800;color:#b07ac0;letter-spacing:2px;font-size:13px}.card0 .e{font-size:84px;line-height:1.1;margin:8px 0;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}
.card0 h2{margin:0;font-size:34px;color:var(--pk);font-weight:900}.card0 p{margin:8px 0 14px;font-weight:700;font-size:17px}
#th-p{display:flex;justify-content:center;gap:8px;margin-bottom:18px}#th-p i{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 3px #fff,0 2px 6px #0003}
.card0 .rule{font-size:14px;color:#8a5a9a;margin:-6px 0 16px}
/* dress-up */
#d-top{padding:calc(var(--sat) + 8px) 10px 6px;display:flex;gap:8px;align-items:center}
#d-theme{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{position:relative;width:78px;height:34px;border-radius:17px;background:#fffd;overflow:hidden;box-shadow:0 3px 0 #0001}
#d-bar{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#7ee8c6,#4fd8ff);transition:width .2s linear}#d-bar.low{background:linear-gradient(90deg,#ff8a65,#ff3d8b);animation:blink .5s infinite alternate}
@keyframes blink{to{opacity:.6}}#d-time{position:relative;display:block;text-align:center;line-height:34px;font-weight:900;font-size:17px}
#d-panel{margin-top:auto;background:linear-gradient(#fffffff0,#fff4fa);border-radius:26px 26px 0 0;box-shadow:0 -6px 24px #8e44ec33;padding:8px 0 calc(var(--sab) + 8px)}
.row{display:flex;gap:8px;overflow-x:auto;padding:4px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.row::-webkit-scrollbar{display:none}
#tools{display:flex;align-items:center;gap:6px;padding:0 10px}
#stampbtn{flex:none;height:40px;padding:0 12px;border-radius:20px;background:#f3e6ff;font-weight:900;font-size:15px;color:var(--pu)}#stampbtn.on{background:var(--pu);color:#fff}
#sw{flex:1;padding:4px 2px}.swb{flex:none;width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 3px #fff,0 2px 5px #0003;transition:transform .1s}.swb.on{transform:scale(1.18);box-shadow:inset 0 0 0 3px #fff,0 0 0 3px var(--pk)}
#stampbar{display:none;gap:8px;padding:4px 10px 0;align-items:center}#stampbar.on{display:flex}
.stp{width:52px;height:44px;border-radius:14px;background:#fff;font-size:22px;box-shadow:0 3px 0 #ecd6f5}.stp.on{background:var(--pk2);color:#fff;box-shadow:0 3px 0 #c4166a}
#hint{font-size:13px;font-weight:800;color:#a06aa8;padding:2px 14px;min-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab{flex:none;width:64px;height:50px;border-radius:16px;background:#f7ecfb;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.tab b{font-size:21px;line-height:1}.tab span{font-size:11px;font-weight:900;margin-top:3px}.tab.on{background:linear-gradient(#ff8fc0,#ff3d8b);color:#fff;box-shadow:0 3px 0 #c4166a}
.tab.has::after{content:'';position:absolute;top:5px;right:7px;width:9px;height:9px;border-radius:50%;background:#7ee8c6;box-shadow:0 0 0 2px #fff}
.card{flex:none;width:82px;height:96px;border-radius:18px;background:#fff;box-shadow:0 3px 0 #ecd6f5,0 0 0 2px #f4e4fa inset;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:6px 4px;position:relative;transition:transform .1s}
.card:active{transform:scale(.94)}.card img{width:58px;height:58px;object-fit:contain}.card span{font-size:11.5px;font-weight:900;line-height:1.1;text-align:center;margin-top:2px}
.card.sel{box-shadow:0 0 0 3px var(--pk) inset,0 3px 0 #c4166a;background:#fff0f7}.card.none b{font-size:28px;line-height:58px;color:#d8b8e0}
.card em{position:absolute;top:4px;left:6px;font-style:normal;font-size:14px}.card.lock img{filter:grayscale(.6) brightness(1.05);opacity:.6}
.card u{position:absolute;top:24px;left:50%;transform:translateX(-50%);text-decoration:none;background:#2b2233dd;color:#ffe066;font-size:12px;font-weight:900;border-radius:10px;padding:2px 7px;white-space:nowrap}
#donebar{display:flex;padding:8px 10px 0}#donebar .big{flex:1;min-height:50px;font-size:19px}
/* runway/judge */
.skip{position:fixed;right:12px;top:calc(var(--sat) + 12px);height:40px;padding:0 16px;border-radius:20px;background:#fffc;font-weight:900;font-size:15px}
/* score */
#s-score{align-items:center;justify-content:flex-end;padding-bottom:calc(var(--sab) + 14px)}
.res{width:min(92vw,380px);background:#fff;border-radius:26px;padding:16px 16px 14px;text-align:center;box-shadow:0 8px 0 #ff9fca,0 18px 40px #0004;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
#sc-stars{font-size:44px;color:#ffcc33;letter-spacing:2px;-webkit-text-stroke:1.5px #c48a00;line-height:1}#sc-stars span{color:#eee;-webkit-text-stroke:1.5px #ddd}
#sc-tot{font-weight:900;font-size:20px;color:var(--pk);margin-top:2px}.gain{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:22px;margin:6px 0;color:#c48a00}
#sc-unl{font-weight:800;font-size:14px;color:var(--pu)}#sc-tip{font-weight:700;font-size:13px;color:#a06aa8;margin:4px 0 10px}
.btn2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn2 .big{min-height:52px;font-size:17px;padding:0 10px}
/* closet */
#s-closet{background:linear-gradient(#fff0f7,#ffd6ea)}#s-closet h2{margin:0;font-size:26px;color:var(--pk);font-weight:900}
#cl-grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;padding:10px 12px calc(var(--sab) + 16px);align-content:start}
.look{background:#fff;border-radius:16px;padding:6px;box-shadow:0 3px 0 #ecd6f5;position:relative}.look img{width:100%;border-radius:12px;display:block}.look span{display:block;font-size:12px;font-weight:900;margin-top:4px}.look em{position:absolute;top:10px;right:10px;font-style:normal;background:#fffe;border-radius:10px;padding:1px 6px;font-weight:900;font-size:12px;color:#c48a00}
.empty{grid-column:1/-1;text-align:center;font-weight:800;color:#a06aa8;margin-top:30vh}
#look{position:fixed;inset:0;background:#2a0b3dcc;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:20;padding:calc(var(--sat) + 10px) 16px calc(var(--sab) + 16px)}#look.on{display:flex}
#look img{max-width:100%;max-height:62vh;border-radius:20px;box-shadow:0 8px 30px #0006}#look-t{color:#fff;font-weight:900;font-size:20px}
#toast{position:fixed;left:50%;top:calc(var(--sat) + 64px);transform:translate(-50%,-20px);background:#2b2233ee;color:#fff;font-weight:900;font-size:15px;padding:10px 18px;border-radius:20px;opacity:0;pointer-events:none;transition:all .25s;z-index:40;max-width:90vw;text-align:center}#toast.on{opacity:1;transform:translate(-50%,0)}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:50}#flash.on{animation:fl .5s}@keyframes fl{0%{opacity:.95}100%{opacity:0}}
.hm{flex:none;width:44px;height:44px;border-radius:22px;background:#fffd;font-size:20px;box-shadow:0 3px 0 #0001}
.hm.corner{position:fixed;left:12px;top:calc(var(--sat) + 12px);height:40px;width:40px}
.card0{position:relative}.hm.incard{position:absolute;left:12px;top:12px;background:#f7ecfb}
.big.gold{background:linear-gradient(#ffe066,#ffb020);color:#6a3a00;box-shadow:0 5px 0 #c47a00,0 10px 24px #ffb02055}
.tbtns{gap:12px}.tbtns .big{min-height:54px}
#confirm{position:fixed;inset:0;z-index:45;background:#2a0b3daa;display:none;align-items:center;justify-content:center}#confirm.on{display:flex}
.cbox{width:min(86vw,340px);background:#fff;border-radius:24px;padding:20px 16px 16px;text-align:center;box-shadow:0 8px 0 #ff9fca;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}.cbox .ce{font-size:44px}.cbox h3{margin:4px 0;font-size:24px;color:var(--pk)}.cbox p{margin:0 0 14px;font-weight:700;color:#8a5a9a}
#s-bank .topbar{width:100%}.big-pill{font-size:20px;padding:8px 16px;background:#fff;color:#8a5a00}
.bank-title{text-align:center;font-weight:900;font-size:30px;color:#fff;-webkit-text-stroke:1.5px #5d1fb0;text-shadow:0 4px 0 #5d1fb0;margin-top:2px}
#bank-host{position:relative;height:30vh;min-height:190px;pointer-events:none}
#bank-say{position:absolute;right:3%;top:30%;max-width:42%;background:#fff;color:#8e44ec;font-weight:900;font-size:15px;padding:8px 12px;border-radius:16px;box-shadow:0 4px 0 #0002}
#bank-say::after{content:'';position:absolute;left:14px;bottom:-10px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}
#bank-say.pop{animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
#bank-grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:6px 14px calc(var(--sab) + 16px);align-content:start}
.bcard{position:relative;background:linear-gradient(#fffdf2,#ffeec2);border-radius:20px;padding:16px 8px 10px;text-align:center;box-shadow:0 5px 0 #c47a00,0 0 0 3px #ffcc33 inset}
.bcard.hot{background:linear-gradient(#fff4fb,#ffd6ea);box-shadow:0 5px 0 #c4166a,0 0 0 3px #ff7eb6 inset}.bcard.royal{grid-column:1/-1;background:linear-gradient(#f3e6ff,#d9b8ff);box-shadow:0 5px 0 #5d1fb0,0 0 0 3px #b39dff inset}
.bcard img{width:100%;max-width:120px;height:auto}.rib{position:absolute;left:50%;top:-8px;transform:translateX(-50%);white-space:nowrap;background:linear-gradient(#ff6fae,#ff3d8b);color:#fff;font-size:12px;font-weight:900;padding:4px 12px;border-radius:6px;box-shadow:0 3px 0 #c4166a;letter-spacing:.5px}
.bcard:not(.hot):not(.royal) .rib{background:linear-gradient(#ffd34d,#ffb020);color:#6a3a00;box-shadow:0 3px 0 #c47a00}.royal .rib{background:linear-gradient(#b48bff,#8e44ec);box-shadow:0 3px 0 #5d1fb0}
.amt{font-size:26px;font-weight:900;color:#8a5a00;line-height:1}.lbl{font-size:12px;font-weight:800;color:#b07a20;margin-bottom:8px}
.free{width:100%;min-height:46px;border-radius:23px;font-size:20px;font-weight:900;color:#fff;background:linear-gradient(#5be38c,#22b35a);box-shadow:0 4px 0 #167a3c;letter-spacing:1px;animation:wig 2.4s ease-in-out infinite}
.free:active{transform:translateY(3px);box-shadow:0 1px 0 #167a3c}.free.cd{filter:grayscale(.7) brightness(.95);animation:none}
@keyframes wig{0%,90%,100%{transform:none}93%{transform:rotate(-3deg) scale(1.04)}96%{transform:rotate(3deg) scale(1.04)}}
.coinic.fly{position:fixed;left:0;top:0;z-index:60;pointer-events:none;width:22px;height:22px}
</style></head><body>
<canvas id="c"></canvas>
<div class="scr" id="s-title">
 <div class="topbar" style="width:100%"><span class="pill"><i class="coinic"></i><span class="coins">0</span></span><button class="mute" data-a="mute">🔊</button></div>
 <div class="logo"><b>Pinco</b><i>Pretty Princess</i></div>
 <div class="tbtns"><span id="t-best"></span><button class="big" data-a="play">▶ PLAY</button><button class="big alt" data-a="closet">👗 MY CLOSET</button><button class="big gold" data-a="bank">🍯 POOH BANK</button></div>
 <div class="ver">%BUILD%</div>
</div>
<div class="scr" id="s-theme"><div class="card0"><button class="hm incard" data-a="gohome" aria-label="Main menu">🏠</button><small>TODAY'S THEME</small><div class="e" id="th-e"></div><h2 id="th-n"></h2><p id="th-h"></p><div id="th-p"></div>
 <div class="rule">90 seconds to style Pinco · ✨ = on-theme item</div><button class="big" data-a="start" style="width:100%">LET'S STYLE! 💖</button></div></div>
<div class="scr" id="s-dress">
 <div id="d-top"><button class="hm" data-a="gohome" aria-label="Main menu">🏠</button><span class="pill" id="d-theme"></span><div class="timer"><div id="d-bar"></div><span id="d-time">90s</span></div><span class="pill"><i class="coinic"></i><span class="coins">0</span></span><button class="mute" data-a="mute">🔊</button></div>
 <div id="d-panel">
  <div id="tools"><button id="stampbtn" data-a="stamp">✏️ Stamp</button><div class="row" id="sw"></div></div>
  <div id="stampbar"><button class="stp" data-t="star">⭐</button><button class="stp" data-t="heart">💖</button><button class="stp" data-t="dot">⚪</button><button class="stp" data-a="clrst" style="width:auto;padding:0 12px;font-size:14px;font-weight:900">Clear</button></div>
  <div id="hint"></div>
  <div class="row" id="tabs"></div>
  <div class="row" id="items" style="padding-top:6px"></div>
  <div id="donebar"><button class="big" data-a="done">✨ TO THE RUNWAY!</button></div>
 </div>
</div>
<div class="scr" id="s-run"><button class="hm corner" data-a="gohome" aria-label="Main menu">🏠</button><button class="skip" data-a="skip">Skip ⏩</button></div>
<div class="scr" id="s-judge"><button class="hm corner" data-a="gohome" aria-label="Main menu">🏠</button><button class="skip" data-a="skip">Skip ⏩</button></div>
<div class="scr" id="s-score"><div class="res"><div id="sc-stars"></div><div id="sc-tot"></div><div class="gain"><i class="coinic"></i><span id="sc-coin"></span> coins</div><div id="sc-unl"></div><div id="sc-tip"></div>
 <div class="btn2"><button class="big ghost" data-a="photo">📸 Photo</button><button class="big ghost" data-a="closet">👗 Closet</button><button class="big alt" data-a="home">🏠 Home</button><button class="big" data-a="next">▶ Next</button></div></div></div>
<div class="scr" id="s-closet"><div class="topbar"><h2>👗 My Closet</h2><button class="big ghost" data-a="cclose" style="min-height:44px;font-size:16px;padding:0 16px">Back</button></div><div id="cl-grid"></div></div>
<div id="look"><div id="look-t"></div><img id="look-img" alt=""><div style="display:flex;gap:10px"><button class="big" id="look-photo">📸 Save PNG</button><button class="big alt" id="look-del">🗑</button><button class="big ghost" data-a="lookx">Close</button></div></div>
<div class="scr" id="s-bank"><div class="topbar"><button class="hm" data-a="bankx" aria-label="Main menu">🏠</button><span class="pill big-pill" id="bank-bal"><i class="coinic"></i><span class="coins">0</span></span><span style="width:44px"></span></div>
 <div class="bank-title">🍯 POOH BANK</div><div id="bank-host"><div id="bank-say"></div></div><div id="bank-grid"></div></div>
<div id="confirm"><div class="cbox"><div class="ce">🏠</div><h3>Leave this round?</h3><p>Your look won't be judged and the timer stops.</p><div class="btn2"><button class="big ghost" data-a="stay">Keep styling</button><button class="big" data-a="leave">Leave</button></div></div></div>
<div id="toast"></div><div id="flash"></div>
<script>
%ITEMS%
%GAME%
</script>
%UPD%
</body></html>
