const rnd=(a,b)=>a+Math.random()*(b-a),rint=(a,b)=>Math.floor(rnd(a,b+1)),pick=a=>a[Math.floor(Math.random()*a.length)];

// ---------- world ----------
const WW=2400,WH=2400,CELL=80,GW=Math.ceil(WW/CELL),GH=Math.ceil(WH/CELL);
const grid=[];for(let i=0;i<GW*GH;i++)grid.push([]);
let G=null;let EID=1;
function gidx(x,y){return clamp(Math.floor(y/CELL),0,GH-1)*GW+clamp(Math.floor(x/CELL),0,GW-1)}
function rebuildGrid(){for(const c of grid)c.length=0;for(const e of G.en)if(!e.dead)grid[gidx(e.x,e.y)].push(e)}
function query(x,y,r,cb){const x0=clamp(Math.floor((x-r)/CELL),0,GW-1),x1=clamp(Math.floor((x+r)/CELL),0,GW-1),y0=clamp(Math.floor((y-r)/CELL),0,GH-1),y1=clamp(Math.floor((y+r)/CELL),0,GH-1);
 for(let gy=y0;gy<=y1;gy++)for(let gx=x0;gx<=x1;gx++){const c=grid[gy*GW+gx];for(let i=0;i<c.length;i++){const e=c[i];if(e.dead)continue;const dx=e.x-x,dy=e.y-y,rr=r+e.r;if(dx*dx+dy*dy<rr*rr)cb(e)}}}
function nearest(x,y,maxr,excl){let best=null,bd=maxr*maxr;for(const e of G.en){if(e.dead||(excl&&excl.has(e.id)))continue;const dx=e.x-x,dy=e.y-y,d=dx*dx+dy*dy;if(d<bd){bd=d;best=e}}return best}

// ---------- stats ----------
function heroMul(){const L=SV.heroes[G.hero]||1;return{d:1+.07*(L-1),h:1+.08*(L-1)}}
function recalc(){const H=HEROES[G.hero],P=G.P,Tm=G.Tm,hm=heroMul(),b=G.bless||{};
 const st={};
 st.dmg=(1+tal('dmg'))*hm.d*(1+.15*(Tm.dmg||0))*(b.dmg?1.35:1);
 st.cd=Math.max(.45,1-.09*(Tm.cd||0))*(b.cd?.8:1);
 st.area=1+.15*(Tm.area||0);
 st.dup=((Tm.dup||0)>=1?1:0)+((Tm.dup||0)>=3?1:0);
 st.crit=.05+.08*(Tm.crit||0)+tal('crit');
 st.armor=H.armor+3*(Tm.armor||0)+tal('armor');
 st.regen=G.noRegen?0:(.15+.7*(Tm.regen||0)+tal('regen'))*(G.mode==='clash'?.4:1);
 st.spd=H.spd*(1+.09*(Tm.speed||0)+tal('speed'));
 const mh=Math.round((H.hp+tal('hp'))*hm.h*(1+.2*(Tm.life||0))*(b.hp?1.4:1));
 if(P.maxhp&&mh>P.maxhp)P.hp+=mh-P.maxhp;P.maxhp=mh;P.hp=Math.min(P.hp,mh);
 st.pick=96*(1+.4*(Tm.magnet||0)+tal('pickup'))*(b.mag?2.2:1)*(G.curse&&G.curse.small?.5:1);
 st.xp=(1+tal('xp')+.1*(Tm.greed||0))*(b.xp?1.5:1);
 st.coin=1+tal('coin')+.2*(Tm.greed||0)+(H.coinBonus||0);
 st.evade=Math.min(.4,tal('evade'));
 G.st=st}

// ---------- run setup ----------
function newRun(mode,ch,opt){opt=opt||{};
 const hero=SV.sel;const H=HEROES[hero];
 G={mode,ch:ch||1,hero,t:0,clock:0,dur:300,P:{x:WW/2,y:WH/2,hp:0,maxhp:0,fx:1,fy:0,inv:0,lv:1,xp:0,need:xpNeed(1),ult:0,ultT:0,vx:0,vy:0,hitT:0,walk:0},
  en:[],pr:[],ep:[],gems:[],fx:[],nums:[],zones:[],W:{},Wo:[],Tm:{},To:[],kills:0,coins:0,dmgDealt:0,boss:null,bossSpawned:0,over:0,pend:0,revived:0,rerolls:2,
  spawnAcc:0,events:[],shake:0,msg:null,surgeN:0,ground:'meadow',floor:1,maxFloor:1,bless:null,curse:null,noRegen:0,meteorT:4,speedMul:1,banner:null,elitesDone:{},trail:[],lastPick:0,pickCombo:0,
  ultNeed:110};
 const C=CHAP[(G.ch-1)%CHAP.length];G.chap=C;G.loop=Math.floor((G.ch-1)/CHAP.length);
 G.hard=mode==='hard';G.ground=C.g;G.mix=C.mix.slice();
 if(mode==='arena'){G.dur=75;G.mix=['goblin','bat','skel','frog','ghost','roach'];G.ground='meadow'}
 if(mode==='brawl'){G.dur=120;G.ground='swamp';G.mix=['goblin','bat']}
 if(mode==='clash'){G.dur=180;G.ground='meadow';G.mix=['goblin','bat','skel','frog','ghost','roach','troll'];G.ch=Math.max(1,Math.min(SV.ch,10))}
 if(mode==='arena'||mode==='clash')G.maxUp=1;
 G.hpS=Math.pow(1.3,G.ch-1)*(G.hard?1.5:1)*Math.pow(3,G.loop);G.dmS=(1+.16*(G.ch-1))*(G.hard?1.3:1);
 if(mode==='arena'){G.hpS=1;G.dmS=1}
 recalc();G.P.hp=G.P.maxhp;
 addWeapon(H.w);
 if(mode==='clash'){const pool=shuffle(SHARED_W.slice());for(let i=0;i<3;i++){addWeapon(pool[i]);G.W[pool[i]].lv=5}}
 if(mode==='brawl'){spawnBoss(true)}
 G.ultNeed=110;G.banner={t:2.4,txt:mode==='normal'||mode==='hard'?TT(C.n):T(mode),c:'#ffe9a8'};
 return G}
function xpNeed(l){return Math.round(4+l*4.2+l*l*.42)}
function addWeapon(id){if(G.W[id])return;G.W[id]={id,lv:1,evo:0,t:.3+Math.random()*.3,a:0,on:0};G.Wo.push(id)}
function addTome(id){if(!G.Tm[id]){G.Tm[id]=0;G.To.push(id)}G.Tm[id]++;recalc()}

// ---------- upgrades / shop ----------
function tomeAllowed(id){if(G.mode==='clash'&&(id==='regen'||id==='speed'))return false;return true}
function evoReady(id){const w=G.W[id];return w&&!w.evo&&w.lv>=5&&G.Tm[WEAP[id].evo]>0}
function heroWeapons(){return Object.keys(WEAP).filter(k=>WEAP[k].hero)}
function genChoices(n){n=n||3;const out=[];
 const evo=G.Wo.filter(evoReady);for(const id of evo)out.push({k:'evo',id});
 const wp=[],tp=[];
 for(const id of G.Wo)if(G.W[id].lv<5)wp.push({k:'w',id});
 if(G.Wo.length<5)for(const id of SHARED_W)if(!G.W[id])wp.push({k:'w',id,nw:1});
 for(const id of G.To)if(G.Tm[id]<3)tp.push({k:'t',id});
 if(G.To.length<5)for(const id of TOME_ORDER)if(G.Tm[id]==null&&tomeAllowed(id))tp.push({k:'t',id,nw:1});
 shuffle(wp);shuffle(tp);
 // keep a weapon/tome mix like a shop
 const pool=[];while(wp.length||tp.length){if(wp.length)pool.push(wp.shift());if(tp.length)pool.push(tp.shift())}
 // favour tomes that evolve owned weapons
 pool.sort((a,b)=>score(b)-score(a)+(Math.random()-.5)*1.2);
 function score(c){if(c.k==='t'&&G.Wo.some(w=>WEAP[w].evo===c.id&&!G.W[w].evo))return 1;if(c.k==='w'&&c.nw&&G.Wo.length<3)return 1.2;if(c.k==='w'&&!c.nw)return G.Wo.length<3?-.3:.5;return 0}
 for(const c of pool){if(out.length>=n)break;out.push(c)}
 while(out.length<Math.min(n,2)){out.push(out.some(c=>c.k==='gold')?{k:'heal'}:{k:'gold'})}
 return out.slice(0,n)}
function applyChoice(c){
 if(c.k==='evo'){G.W[c.id].evo=1;G.W[c.id].t=0;SFX.evo();G.banner={t:2.2,txt:TT(WEAP[c.id].evoN),c:'#ffd25a'};burst(G.P.x,G.P.y,'#ffd25a',40,260)}
 else if(c.k==='w'){if(!G.W[c.id])addWeapon(c.id);else G.W[c.id].lv++;if(G.maxUp)G.W[c.id].lv=5}
 else if(c.k==='t'){addTome(c.id);if(G.maxUp){G.Tm[c.id]=3;recalc()}}
 else if(c.k==='gold'){G.coins+=Math.round(25*G.st.coin)}
 else if(c.k==='heal'){G.P.hp=Math.min(G.P.maxhp,G.P.hp+G.P.maxhp*.4)}
 recalc()}

function mkEnemy(type,x,y,o){o=o||{};const D=EN[type];const hp=D.hp*G.hpS*(1+G.t/190)*(o.hpM||1)*(G.curse&&G.curse.tank?1.5:1)*(G.mode==='arena'?Math.pow(1.35,G.floor-1):1);
 const e={id:EID++,type,x,y,r:D.r*(o.sz||1),hp,mhp:hp,spd:D.spd*(o.spdM||1)*(G.curse&&G.curse.fast?1.25:1)*rnd(.9,1.1),dmg:D.dmg*G.dmS*(o.dmM||1),xp:D.xp*(o.xpM||1),
  vx:0,vy:0,kx:0,ky:0,fl:0,frz:0,stun:0,ht:{},elite:o.elite||0,boss:o.boss||0,armor:(D.armor||0)*(1+G.ch*.1),ph:Math.random()*6,shoot:rnd(1.5,3),flip:1,hitCD:0,sz:o.sz||1,img:o.img||D.img,bt:2.5,bst:0};
 G.en.push(e);return e}
function spawnPos(d){const P=G.P;for(let k=0;k<8;k++){const a=Math.random()*Math.PI*2;const x=P.x+Math.cos(a)*d,y=P.y+Math.sin(a)*d;if(x>40&&y>40&&x<WW-40&&y<WH-40)return[x,y]}
 const a=Math.random()*Math.PI*2;return[clamp(P.x+Math.cos(a)*d,40,WW-40),clamp(P.y+Math.sin(a)*d,40,WH-40)]}
function viewR(){return Math.hypot(VIEW.w,VIEW.h)/2/VIEW.z+50}
function pickType(){const t=G.t;const m=G.mix.filter(k=>{const D=EN[k];if(k==='ogre')return t>110||G.mode==='clash';if(k==='troll')return t>70||G.mode==='clash';if(k==='roach')return t>40||G.ch>3||G.mode!=='normal';return true});
 // weight light enemies more
 const w=m.map(k=>k==='ogre'?.12:k==='troll'?.2:k==='roach'?.5:1);let s=w.reduce((a,b)=>a+b,0),r=Math.random()*s;for(let i=0;i<m.length;i++){r-=w[i];if(r<=0)return m[i]}return m[0]}
function maxAlive(){return IS_MOBILE?210:280}
function spawnTick(dt){const t=G.t;if(G.mode==='brawl'){G.spawnAcc+=dt*(1.6+t/40);}else{
  let rate=(2.6+t/8)*(1+.05*(G.ch-1));if(G.mode==='arena')rate=(2+t/14)*(1+.1*(G.floor-1));if(G.mode==='clash')rate=(1.6+t/16);
  if(G.boss&&!G.boss.dead)rate*=.35;if(G.curse&&G.curse.mob)rate*=2;G.spawnAcc+=dt*rate}
 const R=viewR();
 while(G.spawnAcc>=1){G.spawnAcc-=1;if(G.en.length>=maxAlive())break;const type=G.mode==='brawl'?pick(['goblin','bat']):pickType();
  // groups from one side (multiple sides over time)
  const [x,y]=spawnPos(R*rnd(1,1.15));mkEnemy(type,x,y)}
 if(G.spawnAcc>5)G.spawnAcc=5}
function surge(n,type){const R=viewR()*.95;SFX.surge();G.banner={t:1.8,txt:T('surge'),c:'#ff8a5a'};const sides=rint(2,4),a0=Math.random()*6.28;
 for(let i=0;i<n;i++){if(G.en.length>=maxAlive()+40)break;const s=i%sides,a=a0+s*6.283/sides+rnd(-.35,.35);const d=R*rnd(.95,1.15);const x=clamp(G.P.x+Math.cos(a)*d,30,WW-30),y=clamp(G.P.y+Math.sin(a)*d,30,WH-30);mkEnemy(type||pickType(),x,y)}}
function spawnElite(){const type=pick(G.mix.filter(k=>k!=='bat'))||'goblin';const [x,y]=spawnPos(viewR());const e=mkEnemy(type,x,y,{hpM:11,sz:1.55,dmM:1.6,xpM:12,elite:1,spdM:.95});SFX.elite();G.banner={t:1.6,txt:T('elite'),c:'#ffd25a'};return e}
const BOSSIMG={troll:'e_troll',ogre:'e_ogre',asmon:'h_asmon'};
function spawnBoss(brawl){const C=G.chap;const type=G.mode==='arena'?pick(['troll','ogre']):brawl?'ogre':C.boss;const base=type==='asmon'?'troll':type;
 const [x,y]=brawl?[G.P.x,G.P.y-260]:spawnPos(viewR()*.8);
 let hpM=G.mode==='arena'?60*Math.pow(1.3,G.floor):brawl?900:170;const e=mkEnemy(base,x,y,{hpM,sz:type==='asmon'?2.1:2.6,dmM:2,xpM:40,boss:1,spdM:type==='asmon'?1.25:1.05,img:BOSSIMG[type]});
 e.btype=type;e.bn=G.mode==='arena'?['Arena Champion','アリーナ王者']:brawl?['Mega Ogrin','メガ・オグリン']:C.bn;if(brawl){e.mhp=e.hp=e.hp*(1+.6*(SV.ch-1))}
 G.boss=e;G.bossSpawned=1;SFX.boss();G.banner={t:2.2,txt:T('boss'),c:'#ff5a4a'};G.shake=.5;return e}
function updEnemies(dt){const P=G.P;
 for(const e of G.en){if(e.dead)continue;
  if(e.fl>0)e.fl-=dt;if(e.hitCD>0)e.hitCD-=dt;
  if(e.frz>0){e.frz-=dt;e.kx*=.85;e.ky*=.85;e.x+=e.kx*dt;e.y+=e.ky*dt;continue}
  if(e.stun>0){e.stun-=dt}
  const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1;let sp=e.stun>0?0:e.spd;
  if(e.boss)bossAI(e,dt,dx,dy,d);
  let mx=dx/d,my=dy/d;
  if(EN[e.type].ranged&&!e.boss){if(d<210)sp*=-.6;else if(d<260)sp=0;e.shoot-=dt;if(e.shoot<=0&&d<420){e.shoot=rnd(2.6,3.6);G.ep.push({x:e.x,y:e.y,vx:mx*175,vy:my*175,r:7,dmg:e.dmg,life:3,k:'arrow'})}}
  if(e.dash>0){e.dash-=dt;e.x+=e.dvx*dt;e.y+=e.dvy*dt}else if(e.tele>0){e.tele-=dt}else{e.x+=mx*sp*dt;e.y+=my*sp*dt}
  e.x+=e.kx*dt;e.y+=e.ky*dt;e.kx*=.88;e.ky*=.88;
  if(Math.abs(dx)>4)e.flip=dx<0?-1:1;
  // separation
  if(!EN[e.type].fly||e.boss){const c=grid[gidx(e.x,e.y)];for(let i=0;i<c.length&&i<14;i++){const o=c[i];if(o===e||o.dead)continue;const ox=e.x-o.x,oy=e.y-o.y,rr=(e.r+o.r)*.8,dd=ox*ox+oy*oy;if(dd<rr*rr&&dd>.01){const q=Math.sqrt(dd),push=(rr-q)*.5/q;const wE=e.boss?.1:1,wO=o.boss?.1:1;e.x+=ox*push*wE;e.y+=oy*push*wE;o.x-=ox*push*wO;o.y-=oy*push*wO}}}
  e.x=clamp(e.x,20,WW-20);e.y=clamp(e.y,20,WH-20);
  // contact
  const cr=e.r+16;if(d<cr&&e.hitCD<=0&&e.stun<=0){e.hitCD=.7;hurtP(e.dmg)}
 }
 // despawn far normal enemies -> respawn near
 if((G.clock*60|0)%30===0){const R=viewR()*1.9;for(const e of G.en){if(e.dead||e.boss||e.elite)continue;if(Math.abs(e.x-P.x)>R||Math.abs(e.y-P.y)>R){const [x,y]=spawnPos(viewR()*1.05);e.x=x;e.y=y}}}
}
function bossAI(e,dt,dx,dy,d){e.bt-=dt;const brawl=G.mode==='brawl';
 if(e.bt<=0&&!(e.tele>0)&&!(e.dash>0)){e.bst=(e.bst+1)%3;e.bt=brawl?3:rnd(3,4.2);
  const k=e.btype==='asmon'?['ring','summon','dash'][e.bst]:['dash','ring','summon'][e.bst];
  if(k==='dash'){e.tele=.8;e.tx=dx/d;e.ty=dy/d;G.zones.push({k:'tele',x:e.x,y:e.y,ax:e.tx,ay:e.ty,len:420,life:.8,max:.8});e.pend='dash'}
  if(k==='ring'){const n=e.btype==='asmon'?18:14;for(let i=0;i<n;i++){const a=i/n*6.283+e.ph;G.ep.push({x:e.x,y:e.y,vx:Math.cos(a)*150,vy:Math.sin(a)*150,r:10,dmg:e.dmg*.6,life:4,k:e.btype==='asmon'?'chat':'ball'})}SFX.boom(.4)}

 if(e.pend==='dash'&&!(e.tele>0)){e.pend=0;e.dash=.6;e.dvx=e.tx*520;e.dvy=e.ty*520;SFX.whoosh()}}
function hurtP(d){const P=G.P;if(P.inv>0||G.over||CHEAT_GOD)return;if(Math.random()<G.st.evade){addNum(P.x,P.y-40,'miss','#fff');P.inv=.15;return}
 const dmg=Math.max(1,d-G.st.armor);P.hp-=dmg;P.inv=.35;P.hitT=.25;G.hurtFlash=.3;try{if(SV.snd&&navigator.vibrate)navigator.vibrate(25)}catch(x){}G.shake=Math.max(G.shake,.18);SFX.hurt();addNum(P.x,P.y-46,Math.round(dmg),'#ff5a5a');
 if(P.hp<=0){P.hp=0;endRun(false)}}

 switch(id){
 case 'needle':{const R=(92+7*w.lv)*A*(w.evo?1.4:1),half=w.evo?Math.PI:1.05+.06*w.lv;const ne=nearest(P.x,P.y,R*1.25);const ang=ne?Math.atan2(ne.y-P.y,ne.x-P.x):Math.atan2(P.fy,P.fx);const dirs=[ang];if(st.dup&&!w.evo)dirs.push(ang+Math.PI);

 case 'tongue':{const [fx,fy]=aimDir(300);const a0=Math.atan2(fy,fx);const dirs=w.evo?[a0,a0-.45,a0+.45]:[a0];if(st.dup)dirs.push(a0+Math.PI);const L=(230+14*w.lv)*A,wd=22*A;

 case 'ball':{const n=(w.evo?2:1)+st.dup;const used=new Set();for(let i=0;i<n;i++){const e=nearest(P.x,P.y,380,used);if(!e)break;used.add(e.id);const a=Math.atan2(e.y-P.y,e.x-P.x);proj({k:'ball',x:P.x,y:P.y,vx:Math.cos(a)*460,vy:Math.sin(a)*460,r:12*A,dmg:dm,pierce:0,life:2.5,home:e,bounce:(w.evo?7:3)+Math.floor(w.lv/2)})}SFX.bounce();break}
 case 'stink':{const n=1+st.dup;for(let i=0;i<n;i++){G.zones.push({k:'stink',x:P.x+(i?rnd(-80,80):0),y:P.y+(i?rnd(-80,80):0),R:(56+6*w.lv)*A*(w.evo?1.9:1),life:3.2,max:3.2,tick:0,dmg:dm,pull:w.evo})}SFX.squish();break}
 case 'rant':{const R=(150+10*w.lv)*A*(w.evo?1.45:1);G.zones.push({k:'ring',x:P.x,y:P.y,R,r:0,life:.4,max:.4,dmg:dm,hit:new Set(),stun:w.evo?1:0,c:'#b48aff'});if(st.dup)G.zones.push({k:'ring',x:P.x,y:P.y,R:R*.6,r:0,life:.6,max:.6,dmg:dm*.7,hit:new Set(),c:'#b48aff',delay:.2});SFX.rant();break}
 case 'breath':{const R=(112+9*w.lv)*A,half=w.evo?.6:.45;const a=Math.atan2(P.fy,P.fx);const dirs=w.evo?[a,a+Math.PI]:[a];

 const evo=G.Wo.filter(evoReady);let res=[];if(evo.length)res=[{k:'evo',id:evo[0]}];else{const n=Math.random()<.25?3:1;for(let i=0;i<n;i++){const cs=genChoices(1);if(cs[0]){res.push(cs[0]);applyChoice(cs[0])}}}
 if(evo.length)applyChoice(res[0]);
 const coins=Math.round(rint(10,30)*G.st.coin);G.coins+=coins;SFX.chest();
 if(BOT.on){G.pausedBy=null;return}
 const ov=$('shop');ov.innerHTML='';const box=h('div',{class:'felt ovc'},h('div',{class:'shopT'},'🎁 '+T('chest')));res.forEach((c,i)=>{const d=upCard(c,i,()=>{});d.style.cursor='default';box.append(d)});box.append(h('div',{class:'small',style:'text-align:center;margin-top:8px'},'+'+coins+' 🪙'));
 box.append(h('div',{style:'margin-top:10px'},btn(T('ok'),'g',()=>{ov.classList.remove('on');G.pausedBy=null;LAST=performance.now()},'bChestOk')));ov.append(box);ov.classList.add('on')}
function showFloorPick(first){if(BOT.on){const b=pick(BLESS),c=pick(CURSE);if(first){G.bless={[b.id]:1};G.curse={[c.id]:1};G.noRegen=!!G.curse.noreg;recalc();G.pausedBy=null}else nextFloor({b,c});return}
 const ov=$('pick');ov.innerHTML='';const box=h('div',{class:'felt ovc'},h('div',{class:'shopT'},(first?'🏟️ ':'⭐ '+T('cleared')+' · ')+T('floor')+' '+(first?1:G.floor+1)),h('div',{style:'text-align:center'},T('chooseBless')));
 const bs=shuffle(BLESS.slice()),cs=shuffle(CURSE.slice());for(let i=0;i<2;i++){const ch={b:bs[i],c:cs[i]};const d=h('div',{class:'up',id:'fl'+i,style:'flex-direction:column;align-items:flex-start;gap:2px'},h('div',{class:'nm',style:'color:#3a7a1a'},'✨ '+T('blessing')+': '+TT(ch.b.n)),h('div',{class:'nm',style:'color:#a0302a'},'💀 '+T('curse')+': '+TT(ch.c.n)));
  d.addEventListener('click',()=>{ov.classList.remove('on');if(first){G.bless={[ch.b.id]:1};G.curse={[ch.c.id]:1};G.noRegen=!!G.curse.noreg;if(G.bless.heal)G.P.hp=G.P.maxhp;recalc();G.pausedBy=null}else nextFloor(ch);SFX.click();LAST=performance.now()});box.append(d)}
 if(!first)box.append(h('div',{style:'margin-top:10px'},btn(T('quit'),'k',()=>{ov.classList.remove('on');endRun(true)})));
 ov.append(box);ov.classList.add('on')}
function pauseGame(){if(!G||G.over||G.pausedBy)return;G.pausedBy='pause';JOY.on=0;MOVE.x=MOVE.y=0;const ov=$('pause');ov.innerHTML='';
 const box=h('div',{class:'felt ovc'},h('div',{class:'shopT'},T('pause')));
 const ev=h('div',{class:'felt card',style:'background:#fff8e6;margin:8px 0;max-height:42vh;overflow:auto'},h('div',{class:'cardt'},'★ '+T('evos')));
 const list=[HEROES[G.hero].w,...SHARED_W];for(const w of list){const W=WEAP[w];const a=h('canvas',{width:80,height:80}),b=h('canvas',{width:80,height:80});a.getContext('2d').drawImage(iconCanvas(w,'w',80),0,0);b.getContext('2d').drawImage(iconCanvas(W.evo,'t',80),0,0);
  const have=G.W[w];ev.append(h('div',{class:'evorow',style:have?'':'opacity:.55'},a,h('span',{},TT(W.n)+' Lv5'),' + ',b,h('span',{},TT(TOMES[W.evo].n)),' → ',h('b',{},TT(W.evoN))))}
 box.append(ev,h('div',{style:'display:flex;flex-direction:column;gap:10px'},btn('▶ '+T('resume'),'g',resume,'bResume'),h('div',{class:'row'},btn((SV.snd?'🔊 ':'🔇 ')+T('sound'),'b',()=>{SV.snd^=1;save();pauseGame2()}),btn((SV.mus?'🎵 ':'🔇 ')+T('music'),'b',()=>{SV.mus^=1;save();pauseGame2()})),btn('🏠 '+T('quit'),'k',()=>{$('pause').classList.remove('on');endRun(false,true)},'bQuit')));
 ov.append(box);ov.classList.add('on')}
function pauseGame2(){G.pausedBy=null;pauseGame()}
function resume(){$('pause').classList.remove('on');G.pausedBy=null;LAST=performance.now()}
function endRun(win,quit){if(G.over)return;G.over=1;G.win=win;JOY.on=0;MOVE.x=MOVE.y=0;const m=G.mode;
 if(!win&&!quit&&!G.revived&&m!=='brawl'){showEnd(false,true);return}
 finishRun(win,quit)}
function finishRun(win,quit){G.over=1;const m=G.mode;let unlockedAsmon=false;
 let coins=G.coins;if(win&&(m==='normal'||m==='hard'))coins+=Math.round((40+G.ch*15)*G.st.coin*(m==='hard'?1.6:1));
 if(m==='clash'&&win)coins+=Math.round(90*G.st.coin);if(m==='brawl')coins+=Math.round(Math.min(400,G.dmgDealt/250)*G.st.coin);if(m==='arena')coins+=Math.round(15*(G.maxFloor||0)*G.st.coin);
 if(quit)coins=Math.round(coins*.5);
 SV.coins+=coins;SV.runs++;
 if(win&&m==='normal'&&G.ch===SV.ch){SV.ch++;if(G.ch>=5&&!SV.heroes.asmon){SV.heroes.asmon=1;unlockedAsmon=true}}
 if(win&&m==='hard')SV.hardCh=Math.max(SV.hardCh,G.ch);
 if(m==='arena')SV.arenaBest=Math.max(SV.arenaBest,G.maxFloor||0);if(m==='brawl')SV.brawlBest=Math.max(SV.brawlBest,Math.round(G.dmgDealt));if(m==='clash')SV.clashBest=Math.max(SV.clashBest,Math.floor(G.t));
 save();G.earned=coins;win?SFX.win():SFX.lose();showEnd(win,false,unlockedAsmon)}
function showEnd(win,canRevive,asm){const ov=$('end');ov.innerHTML='';const m=G.mode;const title=m==='arena'?T('floor')+' '+(G.maxFloor||0):m==='brawl'?T('dmgScore')+': '+fmtN(G.dmgDealt):win?T('victory'):T('defeat');
 const box=h('div',{class:'felt ovc'},h('div',{style:'display:flex;justify-content:center'},h('img',{src:'art/'+HEROES[G.hero].img+'.webp',style:'height:120px;animation:'+(win?'bob 1s ease-in-out infinite':'wob 2s infinite')+(win?'':';filter:grayscale(.4)')})),h('div',{class:'shopT',id:'endT'},title));
 const st=(a,b)=>h('div',{class:'stat'},h('span',{},a),h('b',{},b));const tt=Math.floor(G.t);box.append(st(T('time'),Math.floor(tt/60)+':'+String(tt%60).padStart(2,'0')),st(T('kills'),G.kills),st(T('level'),G.P.lv),st(T('damage'),fmtN(G.dmgDealt)));
 if(!canRevive)box.append(st(T('coins'),'🪙 '+G.earned));
 if(asm)box.append(h('div',{class:'felt card',style:'background:#ffe9a8;text-align:center;margin-top:8px'},h('img',{src:'art/h_asmon.webp',style:'height:80px'}),h('div',{class:'cardt'},T('joins'))));
 const col=h('div',{style:'display:flex;flex-direction:column;gap:10px;margin-top:12px'});
 if(canRevive){col.append(btn('🍯 '+T('revive'),'y',()=>{G.revived=1;G.over=0;G.P.hp=G.P.maxhp*.6;G.P.inv=2;query(G.P.x,G.P.y,260,e=>{if(!e.boss){e.kx+=(e.x-G.P.x)*4;e.ky+=(e.y-G.P.y)*4}});boom(G.P.x,G.P.y,200,30);ov.classList.remove('on');LAST=performance.now()},'bRevive'),btn(T('menu'),'k',()=>{ov.classList.remove('on');G.over=0;finishRun(false)},'bGiveUp'))}
 else{if(win&&m==='normal'&&SV.ch<=10)col.append(btn('▶ '+T('next'),'g',()=>{ov.classList.remove('on');startRun('normal',SV.ch)},'bNext'));
  col.append(btn('↻ '+T('retry'),'b',()=>{ov.classList.remove('on');startRun(m,G.ch)},'bRetry'),btn('🏠 '+T('menu'),'k',()=>{ov.classList.remove('on');G=null;show('menu')},'bMenu'))}
 box.append(col);ov.append(box);ov.classList.add('on')}

// ---------- input ----------
const JOY={on:0,id:null,ox:0,oy:0,dx:0,dy:0};const KEYS={};
cv.addEventListener('pointerdown',e=>{SFX.init();if(!G||G.pausedBy||G.over)return;JOY.on=1;JOY.id=e.pointerId;JOY.ox=e.clientX;JOY.oy=e.clientY;JOY.dx=JOY.dy=0;try{cv.setPointerCapture(e.pointerId)}catch(x){}if(G.mode==='clash'&&!G.tC){G.tC=1;toast(T('noMove'))}});
cv.addEventListener('pointermove',e=>{if(!JOY.on||e.pointerId!==JOY.id)return;let dx=e.clientX-JOY.ox,dy=e.clientY-JOY.oy;const d=Math.hypot(dx,dy),R=54;if(d>R){// drag the base along (floating stick)
  JOY.ox+=dx/d*(d-R);JOY.oy+=dy/d*(d-R);dx=dx/d*R;dy=dy/d*R}JOY.dx=dx;JOY.dy=dy;const m=Math.min(1,Math.hypot(dx,dy)/(R*.6));const l=Math.hypot(dx,dy)||1;MOVE.x=dx/l*m;MOVE.y=dy/l*m});
const endJ=e=>{if(e.pointerId!==JOY.id)return;JOY.on=0;MOVE.x=MOVE.y=0;keyMove()};cv.addEventListener('pointerup',endJ);cv.addEventListener('pointercancel',endJ);
function keyMove(){if(JOY.on)return;MOVE.x=(KEYS.ArrowRight||KEYS.d?1:0)-(KEYS.ArrowLeft||KEYS.a?1:0);MOVE.y=(KEYS.ArrowDown||KEYS.s?1:0)-(KEYS.ArrowUp||KEYS.w?1:0)}
addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;const k=e.key.length===1?e.key.toLowerCase():e.key;KEYS[k]=1;keyMove();if(k===' '){e.preventDefault();G&&useUlt()}if(k==='Escape'||k==='p'){if(G&&G.pausedBy==='pause')resume();else pauseGame()}
 if(G&&G.pausedBy==='shop'&&['1','2','3'].includes(k)){const el=$('up'+(+k-1));el&&el.click()}});
addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;KEYS[k]=0;keyMove()});
addEventListener('blur',()=>{for(const k in KEYS)KEYS[k]=0;keyMove();if(G&&!G.over&&!G.pausedBy&&!BOT.on)pauseGame()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&!G.over&&!G.pausedBy&&!BOT.on)pauseGame()});
$('pauseB').addEventListener('click',e=>{e.stopPropagation();SFX.click();pauseGame()});
$('ultB').addEventListener('click',e=>{e.stopPropagation();if(G)useUlt()});

// ---------- loop ----------
let LAST=performance.now(),ACC=0;const DT=1/60;let SIMX=1;
function frame(now){requestAnimationFrame(frame);try{let el=Math.min(.1,(now-LAST)/1000);LAST=now;
 if(G&&!G.over&&!G.pausedBy&&SCR===null){ACC+=el*SIMX;let n=0;while(ACC>=DT&&n<(SIMX>1?SIMX*6:5)){step(DT);ACC-=DT;n++;if(G.pausedBy||G.over)break}if(ACC>DT*5)ACC=0}
 if(G&&SCR===null){render();updUltBtn()}else if(!G){ctx.setTransform(1,0,0,1,0,0)}
 if(G&&SCR===null){const mm=G.boss&&!G.boss.dead?'boss':'battle';if(SFX._m!==mm){SFX._m=mm;SFX.music(mm)}}else if(SFX._m!=='menu'){SFX._m='menu';SFX.music('menu')}
 }catch(err){console.error(err);window.__err=(window.__err||[]);window.__err.push(String(err&&err.stack||err))}}
function updUltBtn(){const b=$('ultB'),f=G.P.ult/G.ultNeed;b.querySelector('.fill').style.height=(f*100)+'%';const r=f>=1;b.classList.toggle('ready',r);$('ultLab').textContent=r?T('ready'):T('special');b.style.display=G.over?'none':''}
// ---------- version banner ----------
function verCheck(){fetch('version.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(j=>{if(j.build&&j.build!==VER){const u=$('upd');u.textContent=T('update');u.style.display='block';u.onclick=()=>location.reload()}}).catch(()=>{})}
// ---------- safe area ----------
function readSafe(){const d=h('div',{style:'position:fixed;top:env(safe-area-inset-top);bottom:env(safe-area-inset-bottom);left:0;width:1px;pointer-events:none;visibility:hidden'});document.body.append(d);const r=d.getBoundingClientRect();SAFE.t=r.top;SAFE.b=innerHeight-r.bottom;d.remove()}
// ---------- boot ----------
(async function(){load();resize();readSafe();show('menu');const hero=IMGLIST.filter(n=>n.startsWith('h_')||n.startsWith('g_'));await loadImgs(hero);$('loading').style.display='none';
 loadImgs(IMGLIST);requestAnimationFrame(frame);verCheck();setInterval(verCheck,90000);
 document.fonts&&document.fonts.ready.then(()=>{SPR.clear();ICONC.clear()})})();
// test hooks
window.HV={get G(){return G},SV:()=>SV,start:startRun,BOT,setSim:x=>SIMX=x,god:v=>CHEAT_GOD=v,step,genChoices,applyChoice,show,save,reset:()=>{localStorage.removeItem(SKEY);location.reload()},spawnBoss,spawnElite,useUlt,endRun};
