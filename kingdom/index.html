function buildPath(pts){const sm=[];const P=[pts[0],...pts,pts[pts.length-1]];for(let i=1;i<P.length-2;i++){for(let k=0;k<10;k++){const t=k/10,p0=P[i-1],p1=P[i],p2=P[i+1],p3=P[i+2];const t2=t*t,t3=t2*t;

 sm.push(pts[pts.length-1]);const L=[0];for(let i=1;i<sm.length;i++)L.push(L[i-1]+Math.hypot(sm[i][0]-sm[i-1][0],sm[i][1]-sm[i-1][1]));return{p:sm,L,len:L[L.length-1]}}
