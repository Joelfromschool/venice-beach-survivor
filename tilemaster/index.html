d","Hiragino Maru Gothic ProN","Hiragino Sans","Arial Rounded MT Bold","Nunito","Noto Sans JP","Yu Gothic",system-ui,sans-serif;--pk:#ff3d8b;--pk2:#ff7eb6;--pu:#8e44ec;--ye:#ffcc33;--dk:#2b2233;--mint:#7ee8c6;--cy:#4fd8ff;--bg1:#ffe3f1;--bg2:#ffc2df}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--F);font-weight:800;color:var(--dk);touch-action:manipulation}
body{background:linear-gradient(180deg,var(--bg1),var(--bg2))}
#bgc,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#bgc{z-index:0}#fx{z-index:45}
#app{position:fixed;inset:0;z-index:2}
.scr{position:absolute;inset:0;display:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.scr.on{display:flex}
.btn{font:inherit;font-weight:900;border:0;border-radius:999px;background:#fff;color:var(--pu);box-shadow:0 5px 0 #d6b8e8,0 8px 14px #8e44ec33;font-size:20px;min-height:56px;min-width:56px;padding:8px 22px;cursor:pointer;letter-spacing:.3px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #d6b8e8}
.btn.pk{background:linear-gradient(180deg,#ff6fa8,var(--pk));color:#fff;box-shadow:0 6px 0 #c41f63,0 10px 16px #ff3d8b55}
.btn.pu{background:linear-gradient(180deg,#a96bf5,var(--pu));color:#fff;box-shadow:0 6px 0 #5e22a8}
.btn.ye{background:linear-gradient(180deg,#ffe07a,var(--ye));color:#7a4a00;box-shadow:0 6px 0 #c48a00}
.btn.big{font-size:28px;min-height:72px;padding:10px 46px}
.btn.icon{padding:0;width:56px;font-size:26px;color:var(--pk)}
/* menu */
#menu{flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
#logo{line-height:.95;margin:0}
#logo .a{display:block;font-size:min(16vw,76px);color:var(--pk);-webkit-text-stroke:3px #fff;paint-order:stroke;text-shadow:0 5px 0 #c41f63,0 8px 14px #ff3d8b66;transform:rotate(-3deg)}
#logo .b{display:block;font-size:min(10vw,44px);color:var(--pu);-webkit-text-stroke:3px #fff;paint-order:stroke;text-shadow:0 4px 0 #5e22a8;margin-top:4px}
.sub{font-size:17px;color:#a03a72;min-height:22px}
#cast{position:relative;width:min(96vw,440px);height:min(30vh,210px)}
#cast img{position:absolute;bottom:0;filter:drop-shadow(0 6px 4px #8e44ec44);animation:bob 1.8s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-10px) rotate(2deg)}}
#coinsM{background:#fff;border-radius:999px;padding:6px 16px;font-size:18px;box-shadow:0 3px 0 #f2c6dc;color:#c48a00}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#topR{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;display:flex;gap:8px;z-index:5}
/* levels */
#levels{flex-direction:column;align-items:center;justify-content:center;gap:14px}
#levels .ttl{font-size:32px;color:var(--pk);-webkit-text-stroke:2px #fff;paint-order:stroke}
#lvGrid{display:grid;grid-template-columns:repeat(5,64px);gap:12px}
#lvGrid .btn{padding:0;font-size:22px;line-height:1.05;color:var(--pk)}
#lvGrid .btn small{display:block;font-size:12px;color:#f0a800}
#lvGrid .btn.lock{background:#f3dbe8;color:#c9a3b8;box-shadow:0 5px 0 #e2bcd0}
/* game */
#game{flex-direction:column}
#bar{height:64px;display:flex;align-items:center;gap:8px;padding:4px 10px;flex:none}
#hud{flex:1;min-width:0;overflow:hidden;display:flex;justify-content:center;gap:8px;align-items:center;white-space:nowrap}
.pill{background:#fff;border-radius:999px;padding:5px clamp(6px,2vw,12px);font-size:clamp(13px,4vw,17px);box-shadow:0 3px 0 #f2c6dc;color:var(--pu)}
.pill b{color:var(--pk)}
#main{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0}
#top{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;position:relative;padding-bottom:4px}
#host{position:absolute;top:0;left:0;right:0;justify-content:center;display:flex;align-items:flex-end;gap:6px;height:0;overflow:visible;transition:height .2s}
#host img{height:100%;filter:drop-shadow(0 4px 3px #8e44ec44);transform-origin:50% 100%}
#host img.cheer{animation:cheer .5s ease-out}
@keyframes cheer{40%{transform:translateY(-14px) scale(1.08) rotate(-4deg)}}
#toast{position:absolute;top:2px;left:50%;translate:-50% 0;z-index:20;white-space:normal;width:max-content;background:#fff;border-radius:18px;padding:8px 16px;font-size:17px;box-shadow:0 4px 0 #f2c6dc;color:var(--pu);max-width:94vw;text-align:center;opacity:0;transition:opacity .25s,transform .25s;transform:scale(.8);pointer-events:none}
#toast.on{opacity:1;transform:scale(1)}
#boardBox{flex:none;position:relative;margin:0 auto}
#side{flex:none;display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 6px 12px}
#holdRow{height:calc(var(--T)*1.1);width:calc(var(--T)*3 + 12px);border-radius:14px;background:#ffffff55;border:2px dashed #ffffffaa}
