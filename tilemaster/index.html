<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#ff7eb6">
<title>Tile Master</title><link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="icon.png">
<style>
:root{--F:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN","Hiragino Sans","Arial Rounded MT Bold","Nunito","Noto Sans JP","Yu Gothic",system-ui,sans-serif;--pk:#ff3d8b;--pk2:#ff7eb6;--pu:#8e44ec;--ye:#ffcc33;--dk:#2b2233;--mint:#7ee8c6;--cy:#4fd8ff;--bg1:#ffe3f1;--bg2:#ffc2df}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--F);font-weight:800;color:var(--dk);touch-action:manipulation}
body{background:linear-gradient(180deg,var(--bg1),var(--bg2))}
#bgc,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#bgc{z-index:0}#fx{z-index:45}
#app{position:fixed;inset:0;z-index:2}
.scr{position:absolute;inset:0;display:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.scr.on{display:flex}
.btn{font:inherit;font-weight:900;border:0;border-radius:999px;background:#fff;color:var(--pu);box-shadow:0 5px 0 #d6b8e8,0 8px 14px #8e44ec33;font-size:20px;min-height:56px;min-width:56px;padding:8px 22px;cursor:pointer;letter-spacing:.3px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #d6b8e8}
.btn.pk{background:linear-gradient(180deg,#ff6fa8,var(--pk));color:#fff;box-shadow:0 6px 0 #c41f63,0 10px 16px #ff3d8b55}
.btn.pu{background:linear-gradient(180deg,#a96bf5,var(--pu));color:#fff;box-shadow:0 6px 0 #5e22a8}
.btn.ye{background:linear-gradient(180deg,#ffe07a,var(--ye));color:#7a4a00;box-shadow:0 6px 0 #c48a00}
.btn.big{font-size:28px;min-height:72px;padding:10px 46px}
.btn.icon{padding:0;width:56px;font-size:26px;color:var(--pk)}
/* menu */
#menu{flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
#logo{line-height:.95;margin:0}
#logo .a{display:block;font-size:min(16vw,76px);color:var(--pk);-webkit-text-stroke:3px #fff;paint-order:stroke;text-shadow:0 5px 0 #c41f63,0 8px 14px #ff3d8b66;transform:rotate(-3deg)}
#logo .b{display:block;font-size:min(10vw,44px);color:var(--pu);-webkit-text-stroke:3px #fff;paint-order:stroke;text-shadow:0 4px 0 #5e22a8;margin-top:4px}
.sub{font-size:17px;color:#a03a72;min-height:22px}
#cast{position:relative;width:min(96vw,440px);height:min(30vh,210px)}
#cast img{position:absolute;bottom:0;filter:drop-shadow(0 6px 4px #8e44ec44);animation:bob 1.8s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-10px) rotate(2deg)}}
#coinsM{background:#fff;border-radius:999px;padding:6px 16px;font-size:18px;box-shadow:0 3px 0 #f2c6dc;color:#c48a00}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#topR{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;display:flex;gap:8px;z-index:5}
/* levels */
#levels{flex-direction:column;align-items:center;justify-content:center;gap:14px}
#levels .ttl{font-size:32px;color:var(--pk);-webkit-text-stroke:2px #fff;paint-order:stroke}
#lvGrid{display:grid;grid-template-columns:repeat(5,64px);gap:12px}
#lvGrid .btn{padding:0;font-size:22px;line-height:1.05;color:var(--pk)}
#lvGrid .btn small{display:block;font-size:12px;color:#f0a800}
#lvGrid .btn.lock{background:#f3dbe8;color:#c9a3b8;box-shadow:0 5px 0 #e2bcd0}
/* game */
#game{flex-direction:column}
#bar{height:64px;display:flex;align-items:center;gap:8px;padding:4px 10px;flex:none}
#hud{flex:1;min-width:0;overflow:hidden;display:flex;justify-content:center;gap:8px;align-items:center;white-space:nowrap}
.pill{background:#fff;border-radius:999px;padding:5px clamp(6px,2vw,12px);font-size:clamp(13px,4vw,17px);box-shadow:0 3px 0 #f2c6dc;color:var(--pu)}
.pill b{color:var(--pk)}
#main{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0}
#top{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;position:relative;padding-bottom:4px}
#host{position:absolute;top:0;left:0;right:0;justify-content:center;display:flex;align-items:flex-end;gap:6px;height:0;overflow:visible;transition:height .2s}
#host img{height:100%;filter:drop-shadow(0 4px 3px #8e44ec44);transform-origin:50% 100%}
#host img.cheer{animation:cheer .5s ease-out}
@keyframes cheer{40%{transform:translateY(-14px) scale(1.08) rotate(-4deg)}}
#toast{position:absolute;top:2px;left:50%;translate:-50% 0;z-index:20;white-space:normal;width:max-content;background:#fff;border-radius:18px;padding:8px 16px;font-size:17px;box-shadow:0 4px 0 #f2c6dc;color:var(--pu);max-width:94vw;text-align:center;opacity:0;transition:opacity .25s,transform .25s;transform:scale(.8);pointer-events:none}
#toast.on{opacity:1;transform:scale(1)}
#boardBox{flex:none;position:relative;margin:0 auto}
#side{flex:none;display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 6px 12px}
#holdRow{height:calc(var(--T)*1.1);width:calc(var(--T)*3 + 12px);border-radius:14px;background:#ffffff55;border:2px dashed #ffffffaa}
#tray{background:linear-gradient(180deg,#fff,#ffe6f2);border-radius:22px;padding:7px;box-shadow:0 6px 0 #e9a6c8,0 10px 18px #ff3d8b33;display:flex;gap:3px;border:3px solid #fff}
#tray .slot{width:var(--S);height:calc(var(--S)*1.1);border-radius:12px;background:#ffd3e7;box-shadow:inset 0 3px 0 #f0b2d0}
#tray.warn{animation:warn .5s ease-in-out infinite alternate}
@keyframes warn{to{box-shadow:0 6px 0 #e9a6c8,0 0 22px #ff3d3d}}
#pw{display:flex;gap:12px}
#pw .btn{position:relative;font-size:14px;min-width:86px;min-height:62px;padding:4px 8px;line-height:1.1;border-radius:20px}
#pw .btn span{display:block;font-size:24px}
#pw .btn i{position:absolute;top:-8px;right:-8px;background:var(--pk);color:#fff;font-style:normal;border-radius:12px;min-width:24px;height:24px;font-size:14px;line-height:24px;padding:0 6px;border:2px solid #fff}
#pw .btn.off{opacity:.45}
#game.shake{animation:shake .35s}
@keyframes shake{20%{transform:translate(-5px,2px) scale(1.01)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px) scale(1.015)}80%{transform:translate(2px,0)}}
@media (orientation:landscape) and (max-height:600px){
 #main{flex-direction:row}
 #top{justify-content:center;padding-bottom:2px}
 #toast{position:fixed;left:auto;right:14px;top:60px;translate:none;max-width:44vw}
 #side{justify-content:center;padding:0 12px 6px;width:min(46vw,400px)}
 #bar{height:52px}
 #bar .btn.icon{width:46px;min-width:46px;min-height:46px;height:46px;font-size:22px}
}
#stage{position:fixed;inset:0;pointer-events:none;z-index:10}
.tile{position:absolute;border-radius:22%;background:var(--c);pointer-events:auto;cursor:pointer;
 box-shadow:inset 0 -5px 0 #0000001f,inset 0 3px 0 #ffffff99,0 calc(var(--T)*.09) 0 var(--e),0 calc(var(--T)*.14) calc(var(--T)*.1) #6a1d4a44;
 border:2px solid #fff;transition:left .28s cubic-bezier(.3,1.3,.5,1),top .28s cubic-bezier(.3,1.3,.5,1),width .28s,height .28s,filter .2s,transform .15s}
.tile::after{content:"";position:absolute;left:10%;right:10%;top:5%;height:28%;border-radius:999px;background:linear-gradient(#ffffffb0,#ffffff00);pointer-events:none}

.tile.cov{filter:brightness(.72) saturate(.5);cursor:default}
.tile.press{transform:scale(.88)}
.tile.pop{animation:tpop .3s ease-in forwards}
@keyframes tpop{40%{transform:scale(1.3) rotate(-8deg)}100%{transform:scale(0) rotate(25deg);opacity:0}}
.tile.land{animation:land .3s}
@keyframes land{50%{transform:scale(1.15,.9)}}
/* overlay */
#ov{position:fixed;inset:0;background:#5e22a866;z-index:50;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(2px)}
#ov.on{display:flex}
#card{background:linear-gradient(180deg,#fff,#fff0f7);border-radius:30px;padding:18px 20px 22px;text-align:center;width:min(92vw,380px);max-height:96vh;overflow:auto;box-shadow:0 8px 0 #e9a6c8,0 16px 30px #5e22a855;border:4px solid #fff;animation:pin .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pin{from{transform:scale(.5) rotate(-6deg);opacity:0}}
#card h2{margin:2px 0;font-size:36px;color:var(--pk);-webkit-text-stroke:2px #fff;paint-order:stroke;text-shadow:0 4px 0 #c41f63}
#card .pics{height:130px;display:flex;justify-content:center;align-items:flex-end;gap:2px}
#card .pics img{height:100%;filter:drop-shadow(0 4px 3px #8e44ec44)}
#card .pics img.s{height:72%}
#card .pics.win img{animation:hop .7s ease-in-out infinite}
#card .pics.win img:nth-child(2){animation-delay:.15s}#card .pics.win img:nth-child(3){animation-delay:.3s}
@keyframes hop{50%{transform:translateY(-14px)}}
#card .pics.lose img{animation:sway 2s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(-6deg) translateY(3px)}}
#card .stars{font-size:44px;letter-spacing:6px;color:var(--ye);-webkit-text-stroke:2px #fff;paint-order:stroke;text-shadow:0 3px 0 #c48a00;min-height:52px}
#card .stars span{display:inline-block;animation:star .5s cubic-bezier(.3,1.8,.5,1) backwards}
#card .stars span:nth-child(2){animation-delay:.25s}#card .stars span:nth-child(3){animation-delay:.5s}
#card .stars .no{color:#f0d6e4;text-shadow:0 3px 0 #e2bcd0}
@keyframes star{from{transform:scale(0) rotate(-90deg)}}
#card p{font-size:19px;margin:8px 0 14px;color:var(--pu)}
#card .row .btn{min-width:120px}
#card input{font:inherit;font-size:26px;width:100%;text-align:center;border-radius:16px;border:3px solid #ffc2df;padding:10px;margin:8px 0;text-transform:uppercase;color:var(--pk)}

// ---------- RNG / levels
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296}}
const LV=[null,{types:3,tut:1},{types:16,layers:8,dens:.66,stacks:12,hard:1},{types:6,layers:3,dens:.5,stacks:0},{types:8,layers:4,dens:.55,stacks:4},{types:9,layers:5,dens:.55,stacks:6},
 {types:10,layers:5,dens:.6,stacks:8},{types:11,layers:6,dens:.6,stacks:8},{types:12,layers:6,dens:.62,stacks:10},{types:13,layers:7,dens:.62,stacks:10},{types:15,layers:8,dens:.66,stacks:12}];
const NL=LV.length-1;
function genPositions(cfg,R){const P=[];
 if(cfg.tut){for(let y=0;y<3;y++)for(let x=0;x<3;x++)P.push({x:1.25+x*1.5,y:.3+y*1.6,z:0});for(let y=0;y<2;y++)for(let x=0;x<2;x++)P.push({x:2+x*1.5,y:1.1+y*1.6,z:1});return P.slice(0,12)}
 for(let z=0;z<cfg.layers;z++){const ox=(z%2)*.5,oy=((z>>1)%2)*.5,cols=7-(z%2),rows=8-((z>>1)%2);
  for(let y=0;y<rows;y++)for(let x=0;x<Math.ceil(cols/2);x++){if(R()<cfg.dens*(z===cfg.layers-1?.8:1))new Set([x,cols-1-x]).forEach(xx=>P.push({x:ox+xx,y:oy+y,z}))}}
 if(cfg.stacks)for(let s=0;s<2;s++)for(let i=0;i<cfg.stacks;i++)P.push({x:0,y:0,z:i,stack:s+1,si:i});
 return P}
function covers(a,b){if(a.stack||b.stack)return a.stack===b.stack&&b.z>a.z;return b.z>a.z&&Math.abs(a.x-b.x)<.97&&Math.abs(a.y-b.y)<.97}
function freeSet(list){return list.filter(a=>!list.some(b=>b!==a&&covers(a,b)))}
function assign(tiles,R,queue){let rem=tiles.slice(),order=[];while(rem.length){const f=freeSet(rem);const p=f[Math.floor(R()*f.length)];order.push(p);rem.splice(rem.indexOf(p),1)}order.forEach((p,i)=>p.type=queue[i]);return order}
function sh(a,R){for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function tripleQueue(n,types,R){const tri=[];for(let i=0;i<n/3;i++)tri.push(i%types);sh(tri,R);const pool=sh([...Array(NT).keys()],R);const q=[];tri.forEach(k=>q.push(pool[k],pool[k],pool[k]));return q}
// ---------- game
let G=null;
function startLevel(n){const cfg=LV[n],R=rng(n*7919+12345);let P=genPositions(cfg,R);
 if(!cfg.tut){P.sort((a,b)=>a.z-b.z);while(P.length%3){const top=P.filter(p=>!p.stack);P.splice(P.indexOf(top[top.length-1]),1)}}
 P.forEach((p,i)=>p.id=i);const order=assign(P,R,tripleQueue(P.length,cfg.types,R));
 let mx=0,my=0;P.forEach(p=>{if(!p.stack){mx=Math.max(mx,p.x+1);my=Math.max(my,p.y+1.1)}});
 G={n,cfg,tiles:P,board:P.slice(),tray:[],hold:[],hist:[],uses:{undo:0,pop:0,shuf:0},used:0,over:false,coins:0,combo:0,lastClr:0,solution:order.map(p=>p.id),tut:cfg.tut?1:0,mx:Math.max(mx,cfg.tut?6:7),my:Math.max(my,cfg.tut?5:8.6),hasStacks:!!cfg.stacks};

 P.forEach(p=>{const e=document.createElement('div');e.className='tile';e.id='t'+p.id;e.innerHTML='<div class="f"></div>';skin(p,e);

function isFree(p){return G.hold.includes(p)||(G.board.includes(p)&&!G.board.some(b=>b!==p&&covers(p,b)))}

function tap(p){if(!G||G.over||G.busy)return;if(G.tray.includes(p))return;if(!isFree(p)){SFX.bad();return}
 ac();SFX.tap();const from=G.hold.includes(p)?'hold':'board';const arr=from==='hold'?G.hold:G.board;arr.splice(arr.indexOf(p),1);
 let idx=G.tray.length;for(let i=G.tray.length-1;i>=0;i--)if(G.tray[i].type===p.type){idx=i+1;break}

  setTimeout(()=>{const now=performance.now();G.combo=(now-G.lastClr<4000)?G.combo+1:1;G.lastClr=now;
   const r=same[1].el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,26,[COL[p.type][0],'#fff','#ffcc33','#ff3d8b']);
   same.forEach(q=>{q.el.classList.add('pop');setTimeout(()=>q.el.remove(),300)});G.tray=G.tray.filter(q=>!same.includes(q));

function usePw(k){if(!G||G.over||G.busy)return;ac();if(!S.cheat&&G.uses[k]>=1){toast(t('used'));SFX.bad();return}
 if(k==='undo'){const h=G.hist.pop();if(!h){toast(t('noUndo'));return}G.tray.splice(G.tray.indexOf(h.p),1);(h.from==='hold'?G.hold:G.board).push(h.p);if(h.from==='board')G.board.sort((a,b)=>a.z-b.z)}

 Object.keys(cnt).forEach(k=>{const need=(3-cnt[k]%3)%3;for(let i=0;i<need;i++){q.push(+k);tally[k]--}});
