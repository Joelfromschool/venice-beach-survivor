*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--F);font-weight:800;color:var(--dk);touch-action:manipulation}
body{background:linear-gradient(180deg,var(--bg1),var(--bg2))}
#bgc,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#bgc{z-index:0}#fx{z-index:45}
#app{position:fixed;inset:0;z-index:2}
.scr{position:absolute;inset:0;display:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.scr.on{display:flex}
.btn{font:inherit;font-weight:900;border:0;border-radius:999px;background:#fff;color:var(--pu);box-shadow:0 5px 0 #d6b8e8,0 8px 14px #8e44ec33;font-size:20px;min-height:56px;min-width:56px;padding:8px 22px;cursor:pointer;letter-spacing:.3px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #d6b8e8}
.btn.pk{background:linear-gradient(180deg,#ff6fa8,var(--pk));color:#fff;box-shadow:0 6px 0 #c41f63,0 10px 16px #ff3d8b55}
.btn.pu{background:linear-gradient(180deg,#a96bf5,var(--pu));color:#fff;box-shadow:0 6px 0 #5e22a8}
.btn.ye{background:linear-gradient(180deg,#ffe07a,var(--ye));color:#7a4a00;box-shadow:0 6px 0 #c48a00}
.btn.big{font-size:28px;min-height:72px;padding:10px 46px}
.btn.icon{padding:0;width:56px;font-size:26px;color:var(--pk)}
/* menu */
#menu{flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
#logo{line-height:.95;margin:0}
#logo .a{display:block;font-size:min(16vw,76px);color:var(--pk);-webkit-text-stroke:3px #fff;paint-order:stroke;text-shadow:0 5px 0 #c41f63,0 8px 14px #ff3d8b66;transform:rotate(-3deg)}
#logo .b{display:block;font-size:min(10vw,44px);color:var(--pu);-webkit-text-stroke:3px #fff;paint-order:stroke;text-shadow:0 4px 0 #5e22a8;margin-top:4px}
.sub{font-size:17px;color:#a03a72;min-height:22px}
#cast{position:relative;width:min(96vw,440px);height:min(30vh,210px)}
#cast img{position:absolute;bottom:0;filter:drop-shadow(0 6px 4px #8e44ec44);animation:bob 1.8s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-10px) rotate(2deg)}}
#coinsM{background:#fff;border-radius:999px;padding:6px 16px;font-size:18px;box-shadow:0 3px 0 #f2c6dc;color:#c48a00}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#topR{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;display:flex;gap:8px;z-index:5}
/* levels */
#levels{flex-direction:column;align-items:center;justify-content:center;gap:14px}
#levels .ttl{font-size:32px;color:var(--pk);-webkit-text-stroke:2px #fff;paint-order:stroke}
#lvGrid{display:grid;grid-template-columns:repeat(5,64px);gap:12px}
#lvGrid .btn{padding:0;font-size:22px;line-height:1.05;color:var(--pk)}
#lvGrid .btn small{display:block;font-size:12px;color:#f0a800}
#lvGrid .btn.lock{background:#f3dbe8;color:#c9a3b8;box-shadow:0 5px 0 #e2bcd0}
/* game */
#game{flex-direction:column}
#bar{height:64px;display:flex;align-items:center;gap:8px;padding:4px 10px;flex:none}
#hud{flex:1;min-width:0;overflow:hidden;display:flex;justify-content:center;gap:8px;align-items:center;white-space:nowrap}
.pill{background:#fff;border-radius:999px;padding:5px clamp(6px,2vw,12px);font-size:clamp(13px,4vw,17px);box-shadow:0 3px 0 #f2c6dc;color:var(--pu)}
.pill b{color:var(--pk)}
#main{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0}
#top{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;position:relative;padding-bottom:4px}
#host{position:absolute;top:0;left:0;right:0;justify-content:center;display:flex;align-items:flex-end;gap:6px;height:0;overflow:visible;transition:height .2s}
#host img{height:100%;filter:drop-shadow(0 4px 3px #8e44ec44);transform-origin:50% 100%}
#host img.cheer{animation:cheer .5s ease-out}
@keyframes cheer{40%{transform:translateY(-14px) scale(1.08) rotate(-4deg)}}
#toast{position:absolute;top:2px;left:50%;translate:-50% 0;z-index:20;white-space:normal;width:max-content;background:#fff;border-radius:18px;padding:8px 16px;font-size:17px;box-shadow:0 4px 0 #f2c6dc;color:var(--pu);max-width:94vw;text-align:center;opacity:0;transition:opacity .25s,transform .25s;transform:scale(.8);pointer-events:none}
#toast.on{opacity:1;transform:scale(1)}
#boardBox{flex:none;position:relative;margin:0 auto}
#side{flex:none;display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 6px 12px}
#holdRow{height:calc(var(--T)*1.1);width:calc(var(--T)*3 + 12px);border-radius:14px;background:#ffffff55;border:2px dashed #ffffffaa}
#tray{background:linear-gradient(180deg,#fff,#ffe6f2);border-radius:22px;padding:7px;box-shadow:0 6px 0 #e9a6c8,0 10px 18px #ff3d8b33;display:flex;gap:3px;border:3px solid #fff}
#tray .slot{width:var(--S);height:calc(var(--S)*1.1);border-radius:12px;background:#ffd3e7;box-shadow:inset 0 3px 0 #f0b2d0}
#tray.warn{animation:warn .5s ease-in-out infinite alternate}
@keyframes warn{to{box-shadow:0 6px 0 #e9a6c8,0 0 22px #ff3d3d}}
#pw{display:flex;gap:12px}
#pw .btn{position:relative;font-size:14px;min-width:86px;min-height:62px;padding:4px 8px;line-height:1.1;border-radius:20px}
#pw .btn span{display:block;font-size:24px}
#pw .btn i{position:absolute;top:-8px;right:-8px;background:var(--pk);color:#fff;font-style:normal;border-radius:12px;min-width:24px;height:24px;font-size:14px;line-height:24px;padding:0 6px;border:2px solid #fff}
#pw .btn.off{opacity:.45}
#game.shake{animation:shake .35s}
@keyframes shake{20%{transform:translate(-5px,2px) scale(1.01)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px) scale(1.015)}80%{transform:translate(2px,0)}}
@media (orientation:landscape) and (max-height:600px){
 #main{flex-direction:row}
 #top{justify-content:center;padding-bottom:2px}
 #toast{position:fixed;left:auto;right:14px;top:60px;translate:none;max-width:44vw}
 #side{justify-content:center;padding:0 12px 6px;width:min(46vw,400px)}
 #bar{height:52px}
 #bar .btn.icon{width:46px;min-width:46px;min-height:46px;height:46px;font-size:22px}
}
#stage{position:fixed;inset:0;pointer-events:none;z-index:10}
.tile{position:absolute;border-radius:22%;background:var(--c);pointer-events:auto;cursor:pointer;
 box-shadow:inset 0 -5px 0 #0000001f,inset 0 3px 0 #ffffff99,0 calc(var(--T)*.09) 0 var(--e),0 calc(var(--T)*.14) calc(var(--T)*.1) #6a1d4a44;
 border:2px solid #fff;transition:left .28s cubic-bezier(.3,1.3,.5,1),top .28s cubic-bezier(.3,1.3,.5,1),width .28s,height .28s,filter .2s,transform .15s}
.tile::after{content:"";position:absolute;left:10%;right:10%;top:5%;height:28%;border-radius:999px;background:linear-gradient(#ffffffb0,#ffffff00);pointer-events:none}
.tile .f{position:absolute;inset:4%;background-image:var(--atlas);background-repeat:no-repeat}
.tile.cov{filter:brightness(.72) saturate(.5);cursor:default}
.tile.press{transform:scale(.88)}
.tile.pop{animation:tpop .3s ease-in forwards}
@keyframes tpop{40%{transform:scale(1.3) rotate(-8deg)}100%{transform:scale(0) rotate(25deg);opacity:0}}
.tile.land{animation:land .3s}
@keyframes land{50%{transform:scale(1.15,.9)}}
/* overlay */
#ov{position:fixed;inset:0;background:#5e22a866;z-index:50;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(2px)}
#ov.on{display:flex}
#card{background:linear-gradient(180deg,#fff,#fff0f7);border-radius:30px;padding:18px 20px 22px;text-align:center;width:min(92vw,380px);max-height:96vh;overflow:auto;box-shadow:0 8px 0 #e9a6c8,0 16px 30px #5e22a855;border:4px solid #fff;animation:pin .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pin{from{transform:scale(.5) rotate(-6deg);opacity:0}}
#card h2{margin:2px 0;font-size:36px;color:var(--pk);-webkit-text-stroke:2px #fff;paint-order:stroke;text-shadow:0 4px 0 #c41f63}
#card .pics{height:130px;display:flex;justify-content:center;align-items:flex-end;gap:2px}
#card .pics img{height:100%;filter:drop-shadow(0 4px 3px #8e44ec44)}
#card .pics img.s{height:72%}
#card .pics.win img{animation:hop .7s ease-in-out infinite}
#card .pics.win img:nth-child(2){animation-delay:.15s}#card .pics.win img:nth-child(3){animation-delay:.3s}
@keyframes hop{50%{transform:translateY(-14px)}}
#card .pics.lose img{animation:sway 2s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(-6deg) translateY(3px)}}
#card .stars{font-size:44px;letter-spacing:6px;color:var(--ye);-webkit-text-stroke:2px #fff;paint-order:stroke;text-shadow:0 3px 0 #c48a00;min-height:52px}
#card .stars span{display:inline-block;animation:star .5s cubic-bezier(.3,1.8,.5,1) backwards}
#card .stars span:nth-child(2){animation-delay:.25s}#card .stars span:nth-child(3){animation-delay:.5s}
#card .stars .no{color:#f0d6e4;text-shadow:0 3px 0 #e2bcd0}
@keyframes star{from{transform:scale(0) rotate(-90deg)}}
#card p{font-size:19px;margin:8px 0 14px;color:var(--pu)}
#card .row .btn{min-width:120px}
#card input{font:inherit;font-size:26px;width:100%;text-align:center;border-radius:16px;border:3px solid #ffc2df;padding:10px;margin:8px 0;text-transform:uppercase;color:var(--pk)}

#menu{gap:8px}
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:min(92vw,360px)}
.mgrid .btn{border-radius:20px;padding:4px 2px;font-size:14px;min-height:62px;line-height:1.1}
.mgrid .btn span{display:block;font-size:22px}
#coinsM{white-space:nowrap}
#page{flex-direction:column}
#pgH{display:flex;align-items:center;gap:10px;padding:8px 10px;flex:none}
#pgT{flex:1;text-align:center;font-size:26px;color:var(--pk);-webkit-text-stroke:2px #fff;paint-order:stroke;margin-right:56px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pgB{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 12px 24px;-webkit-overflow-scrolling:touch;text-align:center}
#pgB h3{color:var(--pu);margin:14px 0 6px}
.pill.big{display:inline-block;font-size:20px;margin:6px 0}
#pgB.mapM{padding:0 0 30px}
#board{position:relative;margin:0 auto;overflow:hidden;border-radius:18px}
.area{position:absolute;left:0;right:0;background-size:100% 100%}
#board svg{position:absolute;left:0;top:0}
.rd0{fill:none;stroke:#0003;stroke-width:46;stroke-linecap:round;transform:translateY(5px)}
.rd1{fill:none;stroke:#fff;stroke-width:44;stroke-linecap:round}
.rd2{fill:none;stroke:#ffe3f0;stroke-width:30;stroke-linecap:round;stroke-dasharray:4 30}
.sp{position:absolute;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:12px;border:3px solid #fff;background:linear-gradient(180deg,#fff8 0 30%,#0000 31%),var(--c);color:#fff;font:inherit;font-weight:900;font-size:15px;box-shadow:0 4px 0 #0003;-webkit-text-stroke:3px #0004;paint-order:stroke;padding:0;cursor:pointer;z-index:2}
.sp.big{width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;font-size:24px;-webkit-text-stroke:0}
.sp.lock{filter:saturate(.35) brightness(1.15);opacity:.85}
.sp small{position:absolute;left:-8px;right:-8px;top:-15px;font-size:11px;color:#ffcc33;-webkit-text-stroke:2px #fff}
.sp.cur{outline:4px solid #ffcc33;animation:hop 1.2s ease-in-out infinite}
.tok{position:absolute;width:58px;height:58px;object-fit:contain;margin:-78px 0 0 -29px;z-index:3;pointer-events:none;filter:drop-shadow(0 3px 2px #0005);animation:hop 1.2s ease-in-out infinite}
.chs{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;font-size:28px;border:0;background:none;z-index:2;padding:0}.chs.got{opacity:.5}
.sign{position:absolute;z-index:2;max-width:50%;pointer-events:none}
.sign b{display:block;background:linear-gradient(#c98a4b,#9a5f2c);color:#fff;border:3px solid #fff;border-radius:12px;padding:5px 10px;font-size:14px;box-shadow:0 4px 0 #6b3d17;text-align:center}
.sign i{display:block;width:8px;height:22px;margin:0 auto;background:#7a4a20}
.lapN{display:flex;gap:8px;justify-content:center;align-items:center;padding:6px}

.mrow{display:flex;justify-content:center;padding:6px 0}
.node{position:relative;width:70px;height:70px;border-radius:50%;border:4px solid #fff;font:inherit;font-weight:900;font-size:24px;color:#fff;background:linear-gradient(180deg,#ff8fbf,var(--pk));box-shadow:0 6px 0 #c41f63,0 8px 14px #0002;cursor:pointer;line-height:1}
.node small{position:absolute;left:0;right:0;bottom:-18px;font-size:14px;color:#f0a800;-webkit-text-stroke:1px #fff;paint-order:stroke}
.node em{position:absolute;top:-12px;right:-12px;font-style:normal;font-size:24px}
.node.boss{width:86px;height:86px;background:linear-gradient(180deg,#c48bff,var(--pu));box-shadow:0 6px 0 #5e22a8}
.node.timed{background:linear-gradient(180deg,#7fe6ff,#18a9d6);box-shadow:0 6px 0 #0d7899}
.node.breather{background:linear-gradient(180deg,#a6f2c8,#3fbf7f);box-shadow:0 6px 0 #2a8a5a}
.node.lock{background:#f3dbe8;color:#c9a3b8;box-shadow:0 5px 0 #e2bcd0}
.node.cur{animation:hop 1s ease-in-out infinite;outline:5px solid #ffcc33}
.node.chest{background:linear-gradient(#ffe07a,var(--ye));box-shadow:0 6px 0 #c48a00;font-size:32px}
.node.chest.got{opacity:.5}
.wban{margin:18px auto 8px;background:#fff;border-radius:999px;padding:8px 18px;display:inline-block;color:var(--pu);font-size:19px;box-shadow:0 4px 0 #e9a6c8}
.mrow.w0{background:#ffe9a033}.mrow.w2{background:#c9f5b033}.mrow.w3{background:#c9b8ff33}.mrow.w4{background:#3a2d5c22}
.dly .pics{height:120px;display:flex;justify-content:center;align-items:flex-end}.dly .pics img{height:100%}.dly .pics img.s{height:75%}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:340px;margin:10px auto;background:#fff;border-radius:20px;padding:10px;box-shadow:0 5px 0 #e9a6c8}
.cal b{color:var(--pk);font-size:13px}.cal span{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;background:#fff0f7;font-size:14px;color:var(--pu)}
.cal span.td{outline:3px solid var(--pk)}.cal span.dn{background:#fff3c2}.cal span:empty{background:none}
.dly p{color:var(--pu);font-size:17px}
.shopG{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;max-width:460px;margin:0 auto}
.si{background:#fff;border-radius:20px;padding:8px;box-shadow:0 5px 0 #e9a6c8;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--pu);font-size:15px}
.si .ic{font-size:34px}.si small{color:#b07a9a}.si .btn{font-size:15px;min-height:44px;padding:4px 10px;width:100%}
.sw{width:56px;height:56px;border-radius:14px;border:3px solid #fff;box-shadow:0 4px 0 #0002}
.sk0{background:linear-gradient(#ff9fca,#ff6fa8)}.sk1{background:linear-gradient(#e8f4ff,#cfe0ff)}.sk2{background:linear-gradient(#ffe88a,#e0a800)}.sk3{background:linear-gradient(#5a4a8a,#2b2050)}
.alb{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:440px;margin:0 auto}
.st{background:#fff;border-radius:18px;padding:6px;box-shadow:0 4px 0 #e9a6c8;font-size:12px;color:var(--pu);transform:rotate(-2deg)}.st:nth-child(even){transform:rotate(2deg)}
.st .sf{aspect-ratio:1;border-radius:14px;background-image:var(--atlas);background-size:1600% 100%;border:3px solid #fff}
.st.lk .sf{filter:brightness(0) opacity(.25)}.ap{color:var(--pu)}
.days7{display:flex;justify-content:center;gap:4px;font-size:22px;margin:6px 0}.days7 span{opacity:.3}.days7 span.on{opacity:1}
.tile.ice::before{content:"";position:absolute;inset:-2px;border-radius:22%;background:linear-gradient(135deg,#e8f9ffd0,#9fdcffb0 50%,#e8f9ffd0);border:2px solid #fff;z-index:2;box-shadow:inset 0 0 10px #fff}
.tile.hid .f{background-image:none!important}
.tile.hid{--c:#ff9fca!important;--e:#d9588f!important;background:repeating-linear-gradient(45deg,#ff9fca 0 8px,#ffb8d8 8px 16px)}
.tile.hid .f::after{content:"?";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:calc(var(--T)*.55);-webkit-text-stroke:2px #d9588f;paint-order:stroke}
.f.bomb{display:flex;align-items:center;justify-content:center;font-size:calc(var(--T)*.62);line-height:1}
body[data-skin="1"] .tile{background:color-mix(in srgb,var(--c) 45%,#fff)}
body[data-skin="2"] .tile{border-color:#ffd75e;box-shadow:inset 0 -5px 0 #0000001f,inset 0 3px 0 #fff9,0 calc(var(--T)*.09) 0 #c48a00,0 calc(var(--T)*.14) calc(var(--T)*.1) #6a1d4a44}
body[data-skin="3"] .tile{background:color-mix(in srgb,var(--c) 35%,#2b2050);border-color:#b9a8ff}
body.dark #pgT,body.dark .sub{color:#ffd0e8}

function isFree(p){return G.hold.includes(p)||(G.board.includes(p)&&!G.board.some(b=>b!==p&&covers(p,b)))}

function tap(p){if(!G||G.over||G.busy)return;if(G.tray.includes(p))return;if(!isFree(p)){SFX.bad();return}

 SFX.tap();const from=G.hold.includes(p)?'hold':'board';const arr=from==='hold'?G.hold:G.board;arr.splice(arr.indexOf(p),1);
 let idx=G.tray.length;for(let i=G.tray.length-1;i>=0;i--)if(G.tray[i].type===p.type){idx=i+1;break}
 G.tray.splice(idx,0,p);G.hist.push({p,from});place();refresh();hud();setTimeout(()=>{p.el.classList.add('land');setTimeout(()=>p.el.classList.remove('land'),300)},250);
 if(G.tut===1){G.tut=2;toast(t('t2'),0)}

   same.forEach(q=>{q.el.classList.add('pop');setTimeout(()=>q.el.remove(),300)});G.tray=G.tray.filter(q=>!same.includes(q));
   const gain=10*Math.min(G.combo,5);G.coins+=gain;S.coins+=gain;save();SFX.clear(G.combo);setTimeout(SFX.coin,150);cheer();

function blast(){const inTray=new Set(G.tray.map(q=>q.type));const v=G.trip.find(g=>g.every(id=>G.board.includes(G.tiles[id]))&&!inTray.has(G.tiles[g[0]].type)&&G.tiles[g[0]].type!==BOMB);
 if(!v)return false;v.forEach(id=>{const q=G.tiles[id];G.board.splice(G.board.indexOf(q),1);const r=q.el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,18,['#ff6b6b','#ffcc33','#fff']);q.el.classList.add('pop');setTimeout(()=>q.el.remove(),300)});

 if(k==='pop'){if(!G.tray.length){toast(t('noPop'));return}if(G.hold.length){toast(t('holdFull'));return}G.hold=G.tray.splice(0,3);G.hist=G.hist.filter(h=>!G.hold.includes(h.p))}
 if(k==='shuf')shuffle();
 if(!S.cheat){if(G.uses[k]>=1){S.inv[k]--;save()}}G.uses[k]++;G.used++;SFX.pw();place();refresh();hud()}
function shuffle(){const R=Math.random;const items=G.board.concat(G.hold);const cnt={};G.tray.forEach(p=>cnt[p.type]=(cnt[p.type]||0)+1);
 const tally={};items.forEach(p=>tally[p.type]=(tally[p.type]||0)+1);const q=[];
 Object.keys(cnt).forEach(k=>{const need=(3-cnt[k]%3)%3;for(let i=0;i<need;i++){q.push(+k);tally[k]--}});
 const tri=[];Object.keys(tally).forEach(k=>{for(let i=0;i<tally[k]/3;i++)tri.push(+k)});sh(tri,R);tri.forEach(k=>q.push(k,k,k));
 let rem=G.board.slice(),order=G.hold.slice();while(rem.length){const f=freeSet(rem);const p=f[Math.floor(R()*f.length)];order.push(p);rem.splice(rem.indexOf(p),1)}

 h+='</div><h3>'+t('skinsT')+'</h3><div class="shopG">';t('skins').forEach((nm,i)=>{const own=S.ownSkin.includes(i);h+='<div class="si"><div class="sw sk'+i+'"></div><div>'+nm+'</div><button class="btn '+(S.skin===i?'':own?'pu':'ye')+'" data-sk="'+i+'">'+(S.skin===i?t('inUse'):own?t('use'):SKP[i]+' 💰')+'</button></div>'});
