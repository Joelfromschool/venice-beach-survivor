*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#f6b73c;font-family:LIL,'Hiragino Maru Gothic ProN','M PLUS Rounded 1c','Yu Gothic',system-ui,sans-serif;color:#4a2a10;touch-action:manipulation}
body{background:radial-gradient(circle at 50% 30%,#ffe7a6 0,#f6b73c 60%,#e08a22 100%)}
#app{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.scr{position:absolute;inset:0;display:none;padding:inherit}
.scr.on{display:flex}
.btn{font:inherit;border:0;border-radius:18px;background:#fff6dd;color:#4a2a10;box-shadow:0 5px 0 #a8641a,0 7px 10px #0003;font-size:22px;min-height:56px;min-width:56px;padding:8px 18px;cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #a8641a}
.btn.big{font-size:28px;min-height:70px;padding:10px 34px;background:#ff5a3c;color:#fff;box-shadow:0 6px 0 #9c2a14,0 8px 12px #0003}
.btn.icon{padding:0;width:56px;font-size:26px}
/* menu */
#menu{flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
#menu h1{margin:0;font-size:min(13vw,64px);color:#fff;text-shadow:0 4px 0 #b4561a,0 0 0 #000;-webkit-text-stroke:2px #7a3410;line-height:1}
#menu .sub{font-size:18px}
#heroWrap{position:relative;height:min(30vh,190px);display:flex;align-items:flex-end;justify-content:center;gap:4px}
#heroWrap img{image-rendering:pixelated;height:100%;animation:bob 1.6s ease-in-out infinite}
#heroWrap img.s{height:62%;animation-delay:.4s}
@keyframes bob{50%{transform:translateY(-8px)}}
#coinsM{font-size:22px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#topR{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;display:flex;gap:8px;z-index:5}
/* levels */
#levels{flex-direction:column;align-items:center;justify-content:center;gap:14px}
#lvGrid{display:grid;grid-template-columns:repeat(5,64px);gap:12px}
#lvGrid .btn{padding:0;font-size:22px;line-height:1.05}
#lvGrid .btn small{display:block;font-size:12px;color:#e0a000}
#lvGrid .btn.lock{background:#c9b48a;color:#8a7350;box-shadow:0 5px 0 #8a6a3a}
/* game */
#game{flex-direction:column}
#bar{height:64px;display:flex;align-items:center;gap:8px;padding:4px 10px;flex:none}
#bar .mid{flex:1;text-align:center;font-size:20px;line-height:1.1;white-space:nowrap;overflow:hidden}
#bar .mid b{color:#fff;-webkit-text-stroke:1px #7a3410;font-size:22px}
#mascot{height:52px;image-rendering:pixelated;transition:transform .2s}
#mascot.hop{transform:translateY(-10px) scale(1.1)}
#main{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0}
#boardBox{flex:1;position:relative;min-height:0;margin:0 6px}
#side{flex:none;display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 6px 12px}
#holdRow{height:var(--T);width:calc(var(--T)*3 + 8px)}
#tray{background:#7a3d14;border-radius:16px;padding:6px;box-shadow:inset 0 3px 0 #0005,0 3px 0 #fff6;display:flex;gap:2px}
#tray .slot{width:var(--S);height:calc(var(--S)*1.08);border-radius:10px;background:#5a2a0c}
#pw{display:flex;gap:12px}
#pw .btn{position:relative;font-size:15px;min-width:84px;min-height:60px;padding:4px 8px;line-height:1.1}
#pw .btn span{display:block;font-size:24px}
#pw .btn i{position:absolute;top:-8px;right:-8px;background:#ff5a3c;color:#fff;font-style:normal;border-radius:12px;min-width:24px;height:24px;font-size:15px;line-height:24px;padding:0 5px}
#pw .btn.off{opacity:.45}
#toast{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);background:#fff6ddee;border-radius:14px;padding:8px 16px;font-size:18px;box-shadow:0 3px 0 #a8641a;z-index:40;max-width:92%;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
@media (orientation:landscape) and (max-height:600px){
 #main{flex-direction:row}
 #side{justify-content:center;padding:0 12px 6px}
 #bar{height:52px}
 #bar .btn.icon{width:46px;min-width:46px;min-height:46px;height:46px;font-size:22px}
 #mascot{height:44px}
 #toast{position:fixed;left:auto;right:12px;bottom:auto;top:58px;transform:none;max-width:44vw}
}
#stage{position:fixed;inset:0;pointer-events:none;z-index:10}

.tile.cov{filter:brightness(.5) saturate(.6);cursor:default}
.tile.inTray{box-shadow:0 2px 0 #c7893c}
.tile.pop{transform:scale(0) rotate(20deg)!important;transition:transform .25s ease-in}
.tile.hint{animation:hint .6s ease-in-out 3}
@keyframes hint{50%{transform:translateY(-6px) scale(1.08)}}
/* overlay */
#ov{position:fixed;inset:0;background:#3a1a0899;z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
#ov.on{display:flex}
#card{background:#fff6dd;border-radius:26px;padding:18px 20px 22px;text-align:center;width:min(92vw,380px);max-height:96vh;overflow:auto;box-shadow:0 8px 0 #a8641a;animation:pin .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pin{from{transform:scale(.5);opacity:0}}
#card h2{margin:4px 0;font-size:34px;color:#ff5a3c;-webkit-text-stroke:1px #7a2a10}
#card .pics{height:120px;display:flex;justify-content:center;align-items:flex-end;gap:6px}
#card .pics img{height:100%;image-rendering:pixelated}
#card .pics img.s{height:70%}
#card .pics.win img{animation:bob 0.8s ease-in-out infinite}
#card .pics.lose img:first-child{animation:sway 2s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(-6deg) translateY(3px)}}
#card .stars{font-size:40px;letter-spacing:4px;color:#ffb400;-webkit-text-stroke:1px #a86a00;min-height:48px}
#card .stars .no{color:#d8c7a0}
#card p{font-size:20px;margin:8px 0 14px}
#card .row .btn{min-width:120px}
#card input{font:inherit;font-size:26px;width:100%;text-align:center;border-radius:14px;border:3px solid #e9cf9c;padding:10px;margin:8px 0;text-transform:uppercase}
.coinfly{position:fixed;font-size:28px;z-index:60;pointer-events:none;animation:cf 1.2s ease-out forwards}
@keyframes cf{to{transform:translateY(-120px);opacity:0}}

function tripleQueue(n,types,R){const tri=[];for(let i=0;i<n/3;i++)tri.push(i%types);for(let i=tri.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[tri[i],tri[j]]=[tri[j],tri[i]]}
 // pick which atlas types: random subset
 const pool=[...Array(NT).keys()];for(let i=pool.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
 const q=[];tri.forEach(k=>q.push(pool[k],pool[k],pool[k]));return q}
// ---------- game state
let G=null;
function startLevel(n){
 const cfg=LV[n],R=rng(n*7919+((S.seedBump||0)*104729)+12345);
 let P=genPositions(cfg,R);
 if(!cfg.tut){ // trim to multiple of 3 from top-most layer
  P.sort((a,b)=>a.z-b.z);while(P.length%3){const top=P.filter(p=>!p.stack);P.splice(P.indexOf(top[top.length-1]),1)}}
 P.forEach((p,i)=>p.id=i);
 const order=assign(P,R,tripleQueue(P.length,cfg.types,R));
 G={n,cfg,tiles:P,board:P.slice(),tray:[],hold:[],hist:[],uses:{undo:0,pop:0,shuf:0},used:0,over:false,coins:0,solution:order.map(p=>p.id),tut:cfg.tut?1:0};
 $('stage').innerHTML='';
 P.forEach(p=>{const e=document.createElement('div');e.className='tile';e.id='t'+p.id;e.innerHTML='<div class="f"></div>';e.firstChild.style.backgroundPosition=(p.type/(NT-1)*100)+'% 0';e.firstChild.style.backgroundSize=(NT*100)+'% 100%';
  e.addEventListener('pointerdown',ev=>{ev.preventDefault();tap(p)});p.el=e;$('stage').appendChild(e)});
 show('game');layout();refresh();hud();
 if(cfg.tut)toast(t('t1'),0);else if(cfg.hard)toast(t('hard'),2600);
}
let TS=40,BX=0,BY=0;
function layout(){if(!G)return;
 const land=innerWidth>innerHeight&&innerHeight<=600;
 let S2=Math.min(52,Math.floor((Math.min(innerWidth,land?420:innerWidth)-40)/7));document.documentElement.style.setProperty('--S',S2+'px');
 const bb=$('boardBox').getBoundingClientRect();
 TS=Math.floor(Math.min(bb.width/BW,bb.height/BH,64));document.documentElement.style.setProperty('--T',TS+'px');
 const bb2=$('boardBox').getBoundingClientRect();TS=Math.floor(Math.min(bb2.width/BW,bb2.height/BH,64));document.documentElement.style.setProperty('--T',TS+'px');
 BX=bb2.left+(bb2.width-TS*BW)/2;BY=bb2.top+(bb2.height-TS*BH)/2+4;
 place();}
function slotRect(i){const s=$('tray').children[i];return s?s.getBoundingClientRect():{left:0,top:0,width:40,height:43}}
function place(){
 const tr=$('tray');if(tr.children.length!==7){tr.innerHTML='';for(let i=0;i<7;i++){const d=document.createElement('div');d.className='slot';tr.appendChild(d)}}
 G.board.forEach(p=>{const e=p.el;e.style.width=TS+'px';e.style.height=TS*1.08+'px';e.style.left=(BX+p.x*TS)+'px';e.style.top=(BY+p.y*TS*1.0)+'px';e.style.zIndex=p.z*2+1+(p.stack?0:0);e.classList.remove('inTray')});
 const hr=$('holdRow').getBoundingClientRect();
 G.hold.forEach((p,i)=>{const e=p.el;e.style.width=TS+'px';e.style.height=TS*1.08+'px';e.style.left=(hr.left+i*(TS+4))+'px';e.style.top=hr.top+'px';e.style.zIndex=200;e.classList.remove('cov')});
 G.tray.forEach((p,i)=>{const r=slotRect(i),e=p.el;e.style.width=r.width+'px';e.style.height=r.height+'px';e.style.left=r.left+'px';e.style.top=r.top+'px';e.style.zIndex=300;e.classList.add('inTray');e.classList.remove('cov')});
}
function refresh(){const f=new Set(freeSet(G.board));G.board.forEach(p=>p.el.classList.toggle('cov',!f.has(p)));
 const inf=S.cheat;[['pUndo','undo'],['pPop','pop'],['pShuf','shuf']].forEach(([id,k])=>{const left=inf?'∞':(1-G.uses[k]);$(id).querySelector('i').textContent=left;$(id).classList.toggle('off',!inf&&G.uses[k]>=1)});}
function hud(){if(!G)return;const left=G.board.length+G.hold.length;$('hud').innerHTML=t('lv')+' <b>'+G.n+'</b> · 💰'+(S.coins)+'<br><small>'+left+' '+t('left')+'</small>';}
let toastT=0;function toast(s,ms){const e=$('toast');e.textContent=s;e.classList.add('on');clearTimeout(toastT);if(ms!==0)toastT=setTimeout(()=>e.classList.remove('on'),ms||1400)}
function isFree(p){return G.hold.includes(p)||(G.board.includes(p)&&!G.board.some(b=>b!==p&&covers(p,b)))}
function tap(p){if(!G||G.over||G.busy)return;if(G.tray.includes(p))return;if(!isFree(p)){SFX.bad();return}
 ac();SFX.tap();
 const from=G.hold.includes(p)?'hold':'board';(from==='hold'?G.hold:G.board).splice((from==='hold'?G.hold:G.board).indexOf(p),1);
 // insert next to same type
 let idx=G.tray.length;for(let i=G.tray.length-1;i>=0;i--)if(G.tray[i].type===p.type){idx=i+1;break}
 G.tray.splice(idx,0,p);G.hist.push({p,from});
 place();refresh();hud();
 if(G.tut===1){G.tut=2;toast(t('t2'),0)}
 const same=G.tray.filter(q=>q.type===p.type);
 if(same.length>=3){G.busy=true;G.hist=G.hist.filter(h=>!same.includes(h.p));
  setTimeout(()=>{same.forEach(q=>{q.el.classList.add('pop');setTimeout(()=>q.el.remove(),260)});G.tray=G.tray.filter(q=>!same.includes(q));G.coins+=10;S.coins+=10;save();SFX.clear();
   const r=slotRect(Math.max(0,idx-1));coinFly(r.left,r.top);mascotHop();
   if(G.tut===2){G.tut=3;toast(t('t3'),2500)}else if(Math.random()<.5)toast(t('nice')[Math.floor(Math.random()*5)],900);
   G.busy=false;place();hud();
   if(!G.board.length&&!G.hold.length&&!G.tray.length)setTimeout(win,450);},230);
 }else if(G.tray.length>=7){G.over=true;setTimeout(lose,500)}
}
function coinFly(x,y){const e=document.createElement('div');e.className='coinfly';e.textContent='💰+10';e.style.left=x+'px';e.style.top=y+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),1300)}
function mascotHop(){const m=$('mascot');m.src=IMG.win;m.classList.add('hop');setTimeout(()=>{m.classList.remove('hop')},250);clearTimeout(mascotHop.t);mascotHop.t=setTimeout(()=>m.src=IMG.pooh,1200)}
function usePw(k){if(!G||G.over||G.busy)return;if(!S.cheat&&G.uses[k]>=1){toast(t('used'));SFX.bad();return}
 if(k==='undo'){const h=G.hist.pop();if(!h){toast(t('noUndo'));return}G.tray.splice(G.tray.indexOf(h.p),1);(h.from==='hold'?G.hold:G.board).push(h.p);if(h.from==='board')G.board.sort((a,b)=>a.z-b.z)}
 if(k==='pop'){if(!G.tray.length){toast(t('noPop'));return}if(G.hold.length){toast(t('holdFull'));return}G.hold=G.tray.splice(0,3);G.hist=G.hist.filter(h=>!G.hold.includes(h.p))}
 if(k==='shuf'){shuffle()}
 G.uses[k]++;G.used++;SFX.pw();place();refresh();hud();}
function shuffle(){const R=Math.random;const items=G.board.concat(G.hold);const cnt={};G.tray.forEach(p=>cnt[p.type]=(cnt[p.type]||0)+1);
 const types=items.map(p=>p.type);const tally={};types.forEach(x=>tally[x]=(tally[x]||0)+1);
 const q=[];Object.keys(cnt).forEach(k=>{const need=(3-cnt[k]%3)%3;for(let i=0;i<need;i++){q.push(+k);tally[k]--}});
 const tri=[];Object.keys(tally).forEach(k=>{for(let i=0;i<tally[k]/3;i++)tri.push(+k)});for(let i=tri.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[tri[i],tri[j]]=[tri[j],tri[i]]}
 tri.forEach(k=>q.push(k,k,k));
 // order picks: hold first (always free), then board free order
 let rem=G.board.slice(),order=G.hold.slice();while(rem.length){const f=freeSet(rem);const p=f[Math.floor(R()*f.length)];order.push(p);rem.splice(rem.indexOf(p),1)}
 order.forEach((p,i)=>{p.type=q[i];p.el.firstChild.style.backgroundPosition=(p.type/(NT-1)*100)+'% 0';p.el.animate([{transform:'rotate(0)'},{transform:'rotate(360deg) scale(.7)'},{transform:'rotate(720deg)'}],{duration:450})});
 G.solution=order.map(p=>p.id);}
function stars(){return S.cheat?3:G.used===0?3:G.used<=1?2:1}
function win(){G.over=true;SFX.win();const st=stars();const bonus=st*20;S.coins+=bonus;G.coins+=bonus;S.stars[G.n]=Math.max(S.stars[G.n]||0,st);S.best=Math.max(S.best,Math.min(NL,G.n+1));save();
 const last=G.n>=NL;card('<div class="pics win"><img class="s" src="'+IMG.pinco+'"><img src="'+IMG.win+'"><img class="s" src="'+IMG.bean+'"></div><h2>'+t('win')+'</h2><div class="stars">'+'★'.repeat(st)+'<span class="no">'+'★'.repeat(3-st)+'</span></div><p>'+(last?t('allDone'):t('winTxt').replace('{c}',G.coins))+'</p><div class="row">'+(last?'':'<button class="btn big" id="cNext">'+t('next')+'</button>')+'<button class="btn" id="cMenu">'+t('menu')+'</button></div>');
 if(!last)$('cNext').onclick=()=>{closeCard();startLevel(G.n+1)};$('cMenu').onclick=()=>{closeCard();toMenu()};}
function lose(){SFX.lose();card('<div class="pics lose"><img src="'+IMG.pooh+'"><img class="s" src="'+IMG.pinco+'"></div><h2>'+t('lose')+'</h2><p>'+t('loseTxt')+'</p><div class="row"><button class="btn big" id="cRetry">'+t('retry')+'</button><button class="btn" id="cMenu">'+t('menu')+'</button></div>');
 $('cRetry').onclick=()=>{closeCard();startLevel(G.n)};$('cMenu').onclick=()=>{closeCard();toMenu()};}
function card(h){$('card').innerHTML=h;$('ov').classList.add('on');$('toast').classList.remove('on')}
function closeCard(){$('ov').classList.remove('on')}
function show(id){document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id===id));if(id!=='game')$('stage').innerHTML=''}
function toMenu(){G=null;show('menu');i18n()}
function levelsScr(){const g=$('lvGrid');g.innerHTML='';for(let i=1;i<=NL;i++){const b=document.createElement('button');const lock=!S.cheat&&i>S.best;b.className='btn'+(lock?' lock':'');const st=S.stars[i]||0;b.innerHTML=(lock?'🔒':i)+'<small>'+'★'.repeat(st)+'</small>';b.onclick=()=>{if(lock){SFX.bad();return}startLevel(i)};g.appendChild(b)}show('levels')}
function codeCard(){card('<h2 style="font-size:26px">'+t('cheat')+'</h2><input id="cIn" maxlength="12" autocomplete="off" autocapitalize="characters"><div class="row"><button class="btn big" id="cOk">'+t('ok')+'</button><button class="btn" id="cX">'+t('cancel')+'</button></div><p id="cMsg" style="min-height:24px"></p>');
 const go=()=>{if($('cIn').value.trim().toUpperCase()==='AMSABABY'){enableCheat();closeCard()}else{$('cMsg').textContent=t('bad');SFX.bad();$('cIn').value=''}};
 $('cOk').onclick=go;$('cIn').onkeydown=e=>{if(e.key==='Enter')go()};$('cX').onclick=closeCard;setTimeout(()=>$('cIn').focus(),50)}
function enableCheat(){S.cheat=true;S.best=NL;save();SFX.win();i18n();if(G){refresh();}const m=$('menu').classList.contains('on');if(m||G){menuToast(t('cheatOn'))}}
function menuToast(s){if(G){toast(s,2200);return}const e=document.querySelector('#menu .sub');e.textContent='⭐ '+s;e.style.color='#c0200a';setTimeout(()=>{e.style.color='';e.textContent=t('sub')},3000)}
let typed='';addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key.length===1){typed=(typed+e.key.toUpperCase()).slice(-8);if(typed==='AMSABABY')enableCheat()}});
$('playB').onclick=()=>{ac();startLevel(Math.min(S.best,NL))};$('lvB').onclick=levelsScr;$('lvBack').onclick=()=>show('menu');$('codeB').onclick=codeCard;
$('langB').onclick=()=>{S.lang=S.lang==='en'?'ja':'en';save();i18n()};
['muteB','muteB2'].forEach(i=>$(i).onclick=()=>{S.mute=!S.mute;save();i18n()});
$('homeB').onclick=()=>{if(!G||G.over){toMenu();return}card('<h2 style="font-size:28px">'+t('quit')+'</h2><div class="row"><button class="btn big" id="qY">'+t('yes')+'</button><button class="btn" id="qN">'+t('no')+'</button></div>');$('qY').onclick=()=>{closeCard();toMenu()};$('qN').onclick=closeCard};
$('pUndo').onclick=()=>usePw('undo');$('pPop').onclick=()=>usePw('pop');$('pShuf').onclick=()=>usePw('shuf');
addEventListener('resize',()=>setTimeout(layout,60));
i18n();
window.TM={get G(){return G},start:startLevel,S,levels:LV,free:()=>G?freeSet(G.board).map(p=>p.id):[],tapId:id=>tap(G.tiles[id]),enableCheat};
})();
</script>
<script>(function(){var B=window.__BUILD__;function nv(s){return String(s||'').replace(/[^0-9.]/g,'').split('.').map(Number)}
function newer(a,b){a=nv(a);b=nv(b);for(var i=0;i<Math.max(a.length,b.length);i++){var x=a[i]||0,y=b[i]||0;if(x!==y)return x>y}return false}
function chk(){try{fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(j){if(j&&newer(j.build,B)&&!document.getElementById('updbar')){var d=document.createElement('div');d.id='updbar';d.textContent='\u{1F36F} Update available \u2014 tap to reload';d.style.cssText='position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);z-index:99998;background:#ff5a3cee;color:#fff;border:2px solid #fff;padding:12px 20px;font:800 17px system-ui,sans-serif;box-shadow:0 4px 0 #000a;cursor:pointer;border-radius:12px;white-space:nowrap';d.onclick=function(e){e.stopPropagation();location.reload()};d.addEventListener('touchstart',function(e){e.stopPropagation();location.reload()},{passive:true});document.body.appendChild(d)}}).catch(function(){})}catch(e){}}
setTimeout(chk,4000);setInterval(chk,60000);document.addEventListener('visibilitychange',function(){if(!document.hidden)chk()});})();</script>
